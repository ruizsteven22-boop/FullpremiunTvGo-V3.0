<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Gestión — Full Premium TvGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F8F9FA] text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ClientPortal() {
      const [deviceId, setDeviceId] = useState(() => localStorage.getItem('tvgo_client_dev_id') || '');
      const [devicePin, setDevicePin] = useState(() => localStorage.getItem('tvgo_client_dev_pin') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [deviceData, setDeviceData] = useState(null);
      const [pricing, setPricing] = useState({ priceOfficialCLP: 4000, priceExternalCLP: 6000 });
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      // Modal de lista
      const [showPlaylistModal, setShowPlaylistModal] = useState(false);
      const [listType, setListType] = useState('XTREAM');
      const [playlistName, setPlaylistName] = useState('Mi Lista TV');
      const [serverHost, setServerHost] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [m3uUrl, setM3uUrl] = useState('');
      const [clientNote, setClientNote] = useState('');

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setErrorMsg('');
        try {
          const res = await fetch('/api/client/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId, devicePin })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Credenciales incorrectas');

          setDeviceData(data.device);
          if (data.pricing) setPricing(data.pricing);
          setIsLoggedIn(true);
          localStorage.setItem('tvgo_client_dev_id', deviceId);
          localStorage.setItem('tvgo_client_dev_pin', devicePin);

          if (data.device.playlist) {
            setPlaylistName(data.device.playlist.name || 'Mi Lista TV');
            setListType(data.device.playlist.type || 'XTREAM');
            setServerHost(data.device.playlist.host || '');
            setUsername(data.device.playlist.username || '');
            setPassword(data.device.playlist.password || '');
            setM3uUrl(data.device.playlist.m3uUrl || '');
          }
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const devParam = urlParams.get('device');
        const statusParam = urlParams.get('status');

        if (devParam) setDeviceId(devParam);
        if (statusParam === 'success') {
          setSuccessMsg('¡Pago acreditado con éxito! Tu dispositivo ha sido activado por 365 días.');
        } else if (statusParam === 'failure') {
          setErrorMsg('El proceso de pago fue cancelado o no completado.');
        }

        if (deviceId && devicePin) {
          handleLogin();
        }
      }, []);

      const handleSavePlaylist = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErrorMsg('');
        setSuccessMsg('');
        try {
          const playlistObj = {
            type: listType,
            name: playlistName,
            host: serverHost.trim().replace(/\/+$/, ''),
            username: username.trim(),
            password: password.trim(),
            m3uUrl: m3uUrl.trim()
          };

          const res = await fetch('/api/client/save-playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId,
              devicePin,
              playlist: playlistObj,
              clientNote
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al guardar');

          setSuccessMsg(data.message);
          setShowPlaylistModal(false);
          handleLogin();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handlePayMercadoPago = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/payment/create-preference', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId,
              tier: deviceData?.clientType || 'OFFICIAL'
            })
          });
          const data = await res.json();
          if (data.init_point) {
            window.location.href = data.init_point;
          } else {
            throw new Error(data.error || 'No se pudo generar el enlace de pago');
          }
        } catch (err) {
          alert('Error de pago: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* ENCABEZADO ESTILO SMARTONE */}
            <header className="bg-[#343A40] text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-700">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-base">
                  TV
                </div>
                <span className="text-xl font-black tracking-tight">Full Premium <span className="text-violet-400">TvGo</span></span>
              </div>

              {isLoggedIn && (
                <div className="flex items-center gap-3 text-xs">
                  <span className="text-slate-300">ID: <strong className="text-white font-mono">{deviceId}</strong></span>
                  <button
                    onClick={() => { setIsLoggedIn(false); localStorage.removeItem('tvgo_client_dev_pin'); }}
                    className="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-bold"
                  >
                    Salir
                  </button>
                </div>
              )}
            </header>

            {/* AVISO LEGAL REPRODUCTOR (IDÉNTICO A SMARTONE) */}
            <div className="bg-[#FFF3CD] border-b border-[#FFEEBA] text-[#856404] px-4 py-3 text-center text-xs font-semibold">
              <strong>Atención:</strong> Full Premium TvGo es un reproductor de vídeo. No ofrecemos canales, suscripciones ni contenido protegido. Los usuarios son responsables de ingresar sus propias listas o cuentas de proveedores legítimos.
            </div>

            <main className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
              {errorMsg && (
                <div className="mb-4 p-3.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-800 text-xs font-bold text-center">
                  {errorMsg}
                </div>
              )}

              {successMsg && (
                <div className="mb-4 p-3.5 rounded-xl bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold text-center">
                  {successMsg}
                </div>
              )}

              {!isLoggedIn ? (
                /* INGRESO AL PORTAL */
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-7 space-y-5">
                  <div className="text-center space-y-1">
                    <h2 className="text-lg font-black text-slate-800">Administrador de Pantallas y Listas</h2>
                    <p className="text-xs text-slate-500">Ingresa los datos que aparecen en la pantalla de tu televisor</p>
                  </div>

                  <form onSubmit={handleLogin} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">ID de Dispositivo (MAC / ID)</label>
                      <input
                        type="text"
                        placeholder="Ej: TVGO-XXXX-XXXX"
                        value={deviceId}
                        onChange={e => setDeviceId(e.target.value.toUpperCase())}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-violet-600 font-mono text-sm"
                        required
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Clave PIN de 4 Dígitos</label>
                      <input
                        type="password"
                        placeholder="Ej: 4821"
                        maxLength="4"
                        value={devicePin}
                        onChange={e => setDevicePin(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-violet-600 font-mono text-sm"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-md transition disabled:opacity-50"
                    >
                      {loading ? 'Accediendo...' : 'Entrar a Mi Panel'}
                    </button>
                  </form>
                </div>
              ) : (
                /* PANEL EN CUADRÍCULA ESTILO SMARTONE */
                <div className="space-y-6">
                  {/* Ficha Superior */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h3 className="text-base font-black text-slate-800">
                        Dispositivo: <span className="font-mono text-violet-600">{deviceData.deviceId}</span>
                      </h3>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Modelo: <strong>{deviceData.deviceModel || 'Smart TV'}</strong> | Estado:{' '}
                        <strong className={deviceData.access.status === 'LICENSED' ? 'text-emerald-600' : 'text-amber-600'}>
                          {deviceData.access.status === 'LICENSED' ? `Activo (365 días)` : `Prueba (${deviceData.access.daysLeft} días restantes)`}
                        </strong>
                      </p>
                    </div>

                    <button
                      onClick={handlePayMercadoPago}
                      className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md transition"
                    >
                      💳 Activar / Renovar Año ($4.000 CLP)
                    </button>
                  </div>

                  {/* Cuadrícula de Opciones */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {/* Botón 1: Agregar Lista */}
                    <div
                      onClick={() => setShowPlaylistModal(true)}
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md hover:border-violet-500 cursor-pointer transition group"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-black">
                          ➕
                        </div>
                        <h4 className="text-sm font-black text-slate-800 group-hover:text-violet-600 transition">
                          {deviceData.playlist ? 'Editar Lista de Reproducción' : 'Cargar Lista para esta Pantalla'}
                        </h4>
                        <p className="text-xs text-slate-500">
                          Asigna o actualiza tus credenciales Xtream o enlace M3U directamente a tu televisor.
                        </p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-blue-600 flex items-center gap-1">
                        Gestionar Lista →
                      </div>
                    </div>

                    {/* Botón 2: Activar Licencia */}
                    <div
                      onClick={handlePayMercadoPago}
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md hover:border-emerald-500 cursor-pointer transition group"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl font-black">
                          💳
                        </div>
                        <h4 className="text-sm font-black text-slate-800 group-hover:text-emerald-600 transition">
                          Pagar Licencia Anual
                        </h4>
                        <p className="text-xs text-slate-500">
                          Pago online 100% seguro con Webpay, CuentaRUT o Tarjetas vía Mercado Pago Chile.
                        </p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-emerald-600 flex items-center gap-1">
                        Pagar Online →
                      </div>
                    </div>

                    {/* Botón 3: Soporte */}
                    <a
                      href={`https://wa.me/56979429123?text=${encodeURIComponent(`Hola! Necesito ayuda con mi dispositivo ${deviceId}`)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md hover:border-violet-500 cursor-pointer transition group"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-2xl font-black">
                          💬
                        </div>
                        <h4 className="text-sm font-black text-slate-800 group-hover:text-purple-600 transition">
                          Atención y Soporte
                        </h4>
                        <p className="text-xs text-slate-500">
                          ¿Dudas con tu configuración o formas de pago por transferencia? Habla con nosotros.
                        </p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-purple-600 flex items-center gap-1">
                        Abrir WhatsApp →
                      </div>
                    </a>
                  </div>

                  {/* Tabla de Listas Configuradas (Idéntica a SmartOne) */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <div className="flex items-center justify-between">
                      <h4 className="text-sm font-black text-slate-800">Listas Asignadas a esta Pantalla</h4>
                      <button
                        onClick={() => setShowPlaylistModal(true)}
                        className="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm"
                      >
                        + Modificar Lista
                      </button>
                    </div>

                    {deviceData.playlist ? (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-100 text-slate-600">
                            <tr>
                              <th className="p-3 rounded-l-xl">Nombre de Lista</th>
                              <th className="p-3">Tipo</th>
                              <th className="p-3">Servidor / URL</th>
                              <th className="p-3">Usuario</th>
                              <th className="p-3 rounded-r-xl text-right">Estado</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            <tr>
                              <td className="p-3 font-bold text-slate-800">{deviceData.playlist.name}</td>
                              <td className="p-3 font-mono text-violet-600">{deviceData.playlist.type}</td>
                              <td className="p-3 text-slate-500 font-mono truncate max-w-xs">{deviceData.playlist.host || deviceData.playlist.m3uUrl}</td>
                              <td className="p-3 font-bold text-slate-700">{deviceData.playlist.username || '-'}</td>
                              <td className="p-3 text-right">
                                <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold text-[10px]">
                                  Sincronizada
                                </span>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    ) : (
                      <div className="p-6 text-center text-slate-400 text-xs border border-dashed rounded-xl">
                        Aún no tienes ninguna lista asignada a este televisor. Pulsa el botón de arriba para cargarla.
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* MODAL PARA AGREGAR LISTA XTREAM O M3U */}
          {showPlaylistModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-black text-slate-800">Cargar Lista de Reproducción</h3>
                  <button onClick={() => setShowPlaylistModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="flex gap-2 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => setListType('XTREAM')}
                    className={`flex-1 py-2 rounded-lg transition ${listType === 'XTREAM' ? 'bg-white shadow text-violet-600' : 'text-slate-600'}`}
                  >
                    API Xtream Codes
                  </button>
                  <button
                    type="button"
                    onClick={() => setListType('M3U')}
                    className={`flex-1 py-2 rounded-lg transition ${listType === 'M3U' ? 'bg-white shadow text-violet-600' : 'text-slate-600'}`}
                  >
                    Enlace M3U
                  </button>
                </div>

                <form onSubmit={handleSavePlaylist} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nombre Identificador</label>
                    <input
                      type="text"
                      value={playlistName}
                      onChange={e => setPlaylistName(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300"
                      required
                    />
                  </div>

                  {listType === 'XTREAM' ? (
                    <>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Servidor (Host:Puerto)</label>
                        <input
                          type="url"
                          placeholder="http://servidor.com:8080"
                          value={serverHost}
                          onChange={e => setServerHost(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs"
                          required
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Usuario</label>
                          <input
                            type="text"
                            value={username}
                            onChange={e => setUsername(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            required
                          />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Contraseña</label>
                          <input
                            type="text"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            required
                          />
                        </div>
                      </div>
                    </>
                  ) : (
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">URL de Lista M3U</label>
                      <input
                        type="url"
                        placeholder="http://servidor.com/get.php?username=..."
                        value={m3uUrl}
                        onChange={e => setM3uUrl(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs"
                        required
                      />
                    </div>
                  )}

                  <div className="pt-2 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowPlaylistModal(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-bold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={loading}
                      className="flex-1 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-md"
                    >
                      {loading ? 'Guardando...' : 'Guardar y Sincronizar TV'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-[#343A40] text-slate-400 text-center py-4 text-xs border-t border-slate-700">
            Full Premium TvGo &copy; 2026 — Soporte Técnico: +56979429123
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ClientPortal />);
  </script>
</body>
</html>
