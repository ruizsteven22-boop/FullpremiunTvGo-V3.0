<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Gestión — Full Premium TvGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F4F6F9] text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function UnifiedPortal() {
      const [deviceId, setDeviceId] = useState(() => localStorage.getItem('tvgo_client_dev_id') || '');
      const [devicePin, setDevicePin] = useState(() => localStorage.getItem('tvgo_client_dev_pin') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userRole, setUserRole] = useState('CLIENT');
      const [deviceData, setDeviceData] = useState(null);
      const [adminData, setAdminData] = useState({ devices: [], settings: {}, licenses: [] });

      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const [showPlaylistModal, setShowPlaylistModal] = useState(false);
      const [targetDeviceId, setTargetDeviceId] = useState('');
      const [targetPin, setTargetPin] = useState('');
      const [listType, setListType] = useState('XTREAM');
      const [playlistName, setPlaylistName] = useState('Mi Lista TV');
      const [serverHost, setServerHost] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [m3uUrl, setM3uUrl] = useState('');
      const [clientNote, setClientNote] = useState('');
      const [deviceModel, setDeviceModel] = useState('');

      const [searchReseller, setSearchReseller] = useState('');

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setErrorMsg('');
        try {
          const res = await fetch('/api/client/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId, devicePin })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');

          setUserRole(data.role);
          if (data.role === 'ADMIN') {
            setAdminData({ devices: data.devices, settings: data.settings, licenses: data.licenses });
          } else {
            setDeviceData(data.device);
          }

          setIsLoggedIn(true);
          localStorage.setItem('tvgo_client_dev_id', deviceId);
          localStorage.setItem('tvgo_client_dev_pin', devicePin);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const devParam = urlParams.get('device');
        const statusParam = urlParams.get('status');

        if (devParam) setDeviceId(devParam);
        if (statusParam === 'success') {
          setSuccessMsg('¡Pago acreditado con éxito! El dispositivo cuenta con 365 días de licencia.');
        } else if (statusParam === 'failure') {
          setErrorMsg('El proceso de pago fue cancelado o no completado.');
        }

        if (deviceId && devicePin) {
          handleLogin();
        }
      }, []);

      const openEditModalForDevice = (dev) => {
        setTargetDeviceId(dev.deviceId);
        setTargetPin(dev.devicePin);
        setClientNote(dev.clientNote || '');
        setDeviceModel(dev.deviceModel || '');

        if (dev.playlist) {
          setPlaylistName(dev.playlist.name || 'Mi Lista TV');
          setListType(dev.playlist.type || 'XTREAM');
          setServerHost(dev.playlist.host || '');
          setUsername(dev.playlist.username || '');
          setPassword(dev.playlist.password || '');
          setM3uUrl(dev.playlist.m3uUrl || '');
        } else {
          setPlaylistName('Mi Lista TV');
          setListType('XTREAM');
          setServerHost('http://st.xn--aejo-gqa.de:80');
          setUsername('');
          setPassword('');
          setM3uUrl('');
        }
        setShowPlaylistModal(true);
      };

      const handleSavePlaylist = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErrorMsg('');
        setSuccessMsg('');
        try {
          const playlistObj = {
            type: listType,
            name: playlistName,
            host: serverHost.trim().replace(/\/+$/, ''),
            username: username.trim(),
            password: password.trim(),
            m3uUrl: m3uUrl.trim()
          };

          const res = await fetch('/api/client/save-playlist', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Admin-Key': userRole === 'ADMIN' ? devicePin : ''
            },
            body: JSON.stringify({
              deviceId: targetDeviceId || deviceId,
              devicePin: targetPin || devicePin,
              playlist: playlistObj,
              clientNote,
              deviceModel
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al guardar la lista');

          setSuccessMsg(data.message);
          setShowPlaylistModal(false);
          handleLogin();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleDeviceAction = async (targetDevId, action) => {
        try {
          const res = await fetch('/api/admin/device-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': devicePin },
            body: JSON.stringify({ deviceId: targetDevId, action })
          });
          const result = await res.json();
          if (result.ok) handleLogin();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const handlePayMercadoPago = async (targetDev) => {
        setLoading(true);
        try {
          const res = await fetch('/api/payment/create-preference', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId: targetDev?.deviceId || deviceId,
              tier: targetDev?.clientType || 'OFFICIAL'
            })
          });
          const data = await res.json();
          if (data.init_point) {
            window.location.href = data.init_point;
          } else {
            throw new Error(data.error || 'No se pudo generar el pago');
          }
        } catch (err) {
          alert('Error de pago: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const filteredResellerDevices = adminData.devices.filter(d =>
        d.deviceId.toLowerCase().includes(searchReseller.toLowerCase()) ||
        (d.clientNote && d.clientNote.toLowerCase().includes(searchReseller.toLowerCase())) ||
        (d.username && d.username.toLowerCase().includes(searchReseller.toLowerCase()))
      );

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <header className="bg-[#343A40] text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-700">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-base">
                  TV
                </div>
                <div>
                  <span className="text-xl font-black tracking-tight">Full Premium <span className="text-violet-400">TvGo</span></span>
                  <span className="ml-2 text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-violet-600/30 text-violet-300">
                    {userRole === 'ADMIN' ? 'Panel Reseller / Admin' : 'Portal Cliente'}
                  </span>
                </div>
              </div>

              {isLoggedIn && (
                <div className="flex items-center gap-3 text-xs">
                  <span className="text-slate-300">
                    {userRole === 'ADMIN' ? 'Administrador Maestro' : `ID: ${deviceId}`}
                  </span>
                  <button
                    onClick={() => { setIsLoggedIn(false); localStorage.removeItem('tvgo_client_dev_pin'); }}
                    className="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-bold"
                  >
                    Cerrar Sesión
                  </button>
                </div>
              )}
            </header>

            <div className="bg-[#FFF3CD] border-b border-[#FFEEBA] text-[#856404] px-4 py-3 text-center text-xs font-semibold">
              <strong>Atención:</strong> Full Premium TvGo es un reproductor de vídeo. No ofrecemos canales, suscripciones ni contenido protegido. Los usuarios son responsables de ingresar sus propias listas o credenciales autorizadas.
            </div>

            <main className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
              {errorMsg && (
                <div className="mb-4 p-3.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-800 text-xs font-bold text-center">
                  {errorMsg}
                </div>
              )}

              {successMsg && (
                <div className="mb-4 p-3.5 rounded-xl bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold text-center">
                  {successMsg}
                </div>
              )}

              {!isLoggedIn ? (
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-7 space-y-5">
                  <div className="text-center space-y-1">
                    <h2 className="text-lg font-black text-slate-800">Administrador de Pantallas y Listas</h2>
                    <p className="text-xs text-slate-500">Ingresa con los datos de tu TV o tu Clave de Administrador</p>
                  </div>

                  <form onSubmit={handleLogin} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">ID de Dispositivo (o 'ADMIN')</label>
                      <input
                        type="text"
                        placeholder="Ej: TVGO-BCVW-41TP"
                        value={deviceId}
                        onChange={e => setDeviceId(e.target.value.toUpperCase())}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-violet-600 font-mono text-sm"
                        required
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Clave PIN / Contraseña Maestra</label>
                      <input
                        type="password"
                        placeholder="PIN de 4 dígitos o Contraseña Admin"
                        value={devicePin}
                        onChange={e => setDevicePin(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-violet-600 font-mono text-sm"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-md transition disabled:opacity-50"
                    >
                      {loading ? 'Accediendo...' : 'Entrar al Panel'}
                    </button>
                  </form>
                </div>
              ) : userRole === 'ADMIN' ? (
                /* VISTA RESELLER UNIFICADA (SMARTONE STYLE) */
                <div className="space-y-6">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <div className="text-xs font-bold text-slate-400 uppercase">Pantallas Totales</div>
                      <div className="text-3xl font-black text-slate-800 mt-1">{adminData.devices.length}</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-emerald-200 shadow-sm bg-emerald-50/30">
                      <div className="text-xs font-bold text-emerald-600 uppercase">Licencias Activas (365 Días)</div>
                      <div className="text-3xl font-black text-emerald-700 mt-1">
                        {adminData.devices.filter(d => d.computed?.status === 'LICENSED').length}
                      </div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm bg-amber-50/30">
                      <div className="text-xs font-bold text-amber-600 uppercase">En Periodo de Prueba</div>
                      <div className="text-3xl font-black text-amber-700 mt-1">
                        {adminData.devices.filter(d => d.computed?.status === 'TRIAL').length}
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <h3 className="text-base font-black text-slate-800">Lista de Teclas Inteligentes / Dispositivos</h3>
                        <p className="text-xs text-slate-500">Administra los accesos, vencimientos y listas de tus clientes</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <input
                          type="text"
                          placeholder="Buscar por ID, nota o cliente..."
                          value={searchReseller}
                          onChange={e => setSearchReseller(e.target.value)}
                          className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs w-64"
                        />
                        <button
                          onClick={() => {
                            setTargetDeviceId('');
                            setTargetPin('');
                            setClientNote('');
                            setShowPlaylistModal(true);
                          }}
                          className="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs font-bold shadow"
                        >
                          + Agregar Lista para MAC
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-100 text-slate-600 uppercase text-[10px] font-bold">
                          <tr>
                            <th className="p-3 rounded-l-xl">Estado</th>
                            <th className="p-3">ID Dispositivo (MAC)</th>
                            <th className="p-3">PIN Fijo</th>
                            <th className="p-3">Vencimiento</th>
                            <th className="p-3">Dispositivo</th>
                            <th className="p-3">Nota / Cliente</th>
                            <th className="p-3">Lista Asignada</th>
                            <th className="p-3 rounded-r-xl text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredResellerDevices.map(dev => {
                            const isLicensed = dev.computed?.status === 'LICENSED';
                            return (
                              <tr key={dev.deviceId} className="hover:bg-slate-50">
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded-full font-bold text-[9px] ${
                                    isLicensed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                  }`}>
                                    {isLicensed ? '✔ Activado' : '⏳ Prueba'}
                                  </span>
                                </td>
                                <td className="p-3 font-mono font-bold text-violet-700">{dev.deviceId}</td>
                                <td className="p-3 font-mono font-bold text-slate-700">{dev.devicePin || '----'}</td>
                                <td className="p-3 text-slate-600">{dev.computed?.daysLeft} días restantes</td>
                                <td className="p-3 text-slate-500">{dev.deviceModel || 'Smart TV'}</td>
                                <td className="p-3 font-bold text-slate-800">{dev.clientNote || 'Sin nota'}</td>
                                <td className="p-3 text-slate-600">
                                  {dev.playlist ? (
                                    <span className="font-semibold text-blue-600">{dev.playlist.name || 'Lista Activa'}</span>
                                  ) : (
                                    <span className="text-slate-400 italic">Sin lista</span>
                                  )}
                                </td>
                                <td className="p-3 text-right space-x-1 whitespace-nowrap">
                                  <button
                                    onClick={() => openEditModalForDevice(dev)}
                                    className="px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 font-bold hover:bg-blue-200"
                                  >
                                    Cargar Lista
                                  </button>
                                  <button
                                    onClick={() => handleDeviceAction(dev.deviceId, 'ACTIVATE_1Y')}
                                    className="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700 font-bold hover:bg-emerald-200"
                                  >
                                    +1 Año
                                  </button>
                                  <button
                                    onClick={() => handleDeviceAction(dev.deviceId, 'RESET_TRIAL')}
                                    className="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-700 font-bold hover:bg-amber-200"
                                  >
                                    Reiniciar
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              ) : (
                /* VISTA CLIENTE INDIVIDUAL */
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h3 className="text-base font-black text-slate-800">
                        Dispositivo: <span className="font-mono text-violet-600">{deviceData.deviceId}</span>
                      </h3>
                      <p className="text-xs text-slate-500 mt-0.5">
                        PIN Permanente: <strong className="font-mono text-slate-800">{deviceData.devicePin}</strong> | Estado:{' '}
                        <strong className={deviceData.access.status === 'LICENSED' ? 'text-emerald-600' : 'text-amber-600'}>
                          {deviceData.access.status === 'LICENSED' ? `Activo (365 días)` : `Prueba (${deviceData.access.daysLeft} días)`}
                        </strong>
                      </p>
                    </div>

                    <button
                      onClick={() => handlePayMercadoPago(deviceData)}
                      className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md transition"
                    >
                      💳 Activar / Renovar Año ($4.000 CLP)
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <div
                      onClick={() => openEditModalForDevice(deviceData)}
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:border-violet-500 cursor-pointer transition"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-black">➕</div>
                        <h4 className="text-sm font-black text-slate-800">
                          {deviceData.playlist ? 'Editar Lista de Reproducción' : 'Cargar Lista para esta Pantalla'}
                        </h4>
                        <p className="text-xs text-slate-500">Asigna tus credenciales Xtream o URL M3U a tu televisor.</p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-blue-600">Gestionar Lista →</div>
                    </div>

                    <div
                      onClick={() => handlePayMercadoPago(deviceData)}
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:border-emerald-500 cursor-pointer transition"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl font-black">💳</div>
                        <h4 className="text-sm font-black text-slate-800">Pagar Licencia Anual</h4>
                        <p className="text-xs text-slate-500">Pago seguro vía Mercado Pago Chile (Webpay / CuentaRUT).</p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-emerald-600">Pagar Online →</div>
                    </div>

                    <a
                      href={`https://wa.me/56979429123?text=${encodeURIComponent(`Hola! Necesito soporte con mi pantalla ${deviceId}`)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:border-purple-500 cursor-pointer transition"
                    >
                      <div className="space-y-2">
                        <div className="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-2xl font-black">💬</div>
                        <h4 className="text-sm font-black text-slate-800">Soporte por WhatsApp</h4>
                        <p className="text-xs text-slate-500">Atención directa para activaciones y consultas técnicas.</p>
                      </div>
                      <div className="mt-4 text-xs font-bold text-purple-600">Contactar →</div>
                    </a>
                  </div>
                </div>
              )}
            </main>
          </div>

          {showPlaylistModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="text-base font-black text-slate-800">Asignar Lista de Reproducción</h3>
                    <p className="text-xs text-slate-500 font-mono">Dispositivo: {targetDeviceId || deviceId}</p>
                  </div>
                  <button onClick={() => setShowPlaylistModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="flex gap-2 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => setListType('XTREAM')}
                    className={`flex-1 py-2 rounded-lg transition ${listType === 'XTREAM' ? 'bg-white shadow text-violet-600' : 'text-slate-600'}`}
                  >
                    API Xtream Codes
                  </button>
                  <button
                    type="button"
                    onClick={() => setListType('M3U')}
                    className={`flex-1 py-2 rounded-lg transition ${listType === 'M3U' ? 'bg-white shadow text-violet-600' : 'text-slate-600'}`}
                  >
                    Enlace M3U
                  </button>
                </div>

                <form onSubmit={handleSavePlaylist} className="space-y-3 text-xs">
                  {userRole === 'ADMIN' && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Nombre Cliente (Nota)</label>
                        <input
                          type="text"
                          placeholder="Ej: Claudio González"
                          value={clientNote}
                          onChange={e => setClientNote(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Modelo Pantalla</label>
                        <input
                          type="text"
                          placeholder="Ej: Samsung 2025"
                          value={deviceModel}
                          onChange={e => setDeviceModel(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300"
                        />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nombre Identificador de Lista</label>
                    <input
                      type="text"
                      value={playlistName}
                      onChange={e => setPlaylistName(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300"
                      required
                    />
                  </div>

                  {listType === 'XTREAM' ? (
                    <>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Servidor (Host:Puerto)</label>
                        <input
                          type="url"
                          placeholder="http://servidor.com:8080"
                          value={serverHost}
                          onChange={e => setServerHost(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs"
                          required
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Usuario</label>
                          <input
                            type="text"
                            value={username}
                            onChange={e => setUsername(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            required
                          />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Contraseña</label>
                          <input
                            type="password"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            required
                          />
                        </div>
                      </div>
                    </>
                  ) : (
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">URL de Lista M3U</label>
                      <input
                        type="url"
                        placeholder="http://servidor.com/get.php?username=..."
                        value={m3uUrl}
                        onChange={e => setM3uUrl(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs"
                        required
                      />
                    </div>
                  )}

                  <div className="pt-2 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowPlaylistModal(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-bold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={loading}
                      className="flex-1 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-md"
                    >
                      {loading ? 'Guardando...' : 'Guardar Lista'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-[#343A40] text-slate-400 text-center py-4 text-xs border-t border-slate-700">
            Full Premium TvGo &copy; 2026 — Soporte Técnico Oficial: +56979429123
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<UnifiedPortal />);
  </script>
</body>
</html>
