<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Full Premium TvGo — Plataforma OTT</title>
  <meta name="theme-color" content="#060811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(8, 12, 22, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.8); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#060811] text-slate-100 min-h-screen selection:bg-violet-600 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OFFICIAL_SERVER_HOST = 'http://st.xn--aejo-gqa.de:80';

    function getOrCreateDeviceId() {
      let id = localStorage.getItem('tvgo_device_id');
      if (!id) {
        const rand = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        id = `TVGO-${rand()}-${rand()}`;
        localStorage.setItem('tvgo_device_id', id);
      }
      return id;
    }

    function extractXtreamFromUrl(rawUrl) {
      if (!rawUrl) return null;
      try {
        const uMatch = rawUrl.match(/[?&]username=([^&]+)/i);
        const pMatch = rawUrl.match(/[?&]password=([^&]+)/i);
        const hostMatch = rawUrl.match(/^(https?:\/\/[^\/?#]+)/i);
        if (uMatch && pMatch && hostMatch) {
          return {
            host: hostMatch[1],
            username: decodeURIComponent(uMatch[1]),
            password: decodeURIComponent(pMatch[1])
          };
        }
      } catch (_) {}
      return null;
    }

    function parseM3uPlaylist(m3uContent) {
      const lines = m3uContent.split(/\r?\n/);
      const live = [];
      const movies = [];
      const series = [];
      const liveCats = new Set();
      const movieCats = new Set();
      const seriesCats = new Set();

      let currentMeta = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          const commaIndex = line.lastIndexOf(',');
          const title = commaIndex !== -1 ? line.slice(commaIndex + 1).trim() : 'Canal';
          const group = groupMatch ? groupMatch[1].trim() : 'General';
          const logo = logoMatch ? logoMatch[1].trim() : '';
          currentMeta = { title, group, logo };
        } else if (!line.startsWith('#') && currentMeta) {
          const url = line;
          const lowerUrl = url.toLowerCase();
          const lowerTitle = currentMeta.title.toLowerCase();
          const lowerGroup = currentMeta.group.toLowerCase();

          const isMovieFile = lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.mkv') || lowerUrl.endsWith('.avi');
          const isSeriePattern = /s\d{1,2}[\s._-]?e\d{1,2}|temporada|capitulo|episodio/i.test(lowerTitle) || lowerGroup.includes('serie');

          if (isSeriePattern && isMovieFile) {
            seriesCats.add(currentMeta.group);
            series.push({
              type: 'MOVIE',
              id: `m3u-ser-${series.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              ext: lowerUrl.endsWith('.mkv') ? 'mkv' : 'mp4',
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          } else if (isMovieFile || lowerGroup.includes('pelicula') || lowerGroup.includes('vod') || lowerGroup.includes('cine')) {
            movieCats.add(currentMeta.group);
            movies.push({
              type: 'MOVIE',
              id: `m3u-mov-${movies.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              ext: lowerUrl.endsWith('.mkv') ? 'mkv' : 'mp4',
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          } else {
            liveCats.add(currentMeta.group);
            live.push({
              type: 'LIVE',
              id: `m3u-live-${live.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          }
          currentMeta = null;
        }
      }

      return {
        live,
        movies,
        series,
        categories: {
          LIVE: Array.from(liveCats).map(g => ({ category_id: g, category_name: g })),
          MOVIES: Array.from(movieCats).map(g => ({ category_id: g, category_name: g })),
          SERIES: Array.from(seriesCats).map(g => ({ category_id: g, category_name: g }))
        }
      };
    }

    function App() {
      const [deviceId] = useState(getOrCreateDeviceId);
      const [devicePin, setDevicePin] = useState('----');
      const [deviceAccess, setDeviceAccess] = useState({ allowed: true, status: 'TRIAL', daysLeft: 12 });

      const [adminNotice, setAdminNotice] = useState(null);
      const [dismissedNotice, setDismissedNotice] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('tvgo_favorites') || '[]');
        } catch (_) {
          return [];
        }
      });

      const [manualMode, setManualMode] = useState(false);
      const [activeServerHost, setActiveServerHost] = useState(OFFICIAL_SERVER_HOST);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [customHost, setCustomHost] = useState('');

      const [auth, setAuth] = useState(false);
      const [activeTab, setActiveTab] = useState('LIVE');
      const [categories, setCategories] = useState({ LIVE: [], MOVIES: [], SERIES: [] });
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const [liveCatalog, setLiveCatalog] = useState([]);
      const [moviesCatalog, setMoviesCatalog] = useState([]);
      const [seriesCatalog, setSeriesCatalog] = useState([]);

      const [visibleLimit, setVisibleLimit] = useState(80);
      const [seriesEpisodes, setSeriesEpisodes] = useState([]);
      const [selectedSerieInfo, setSelectedSerieInfo] = useState(null);

      const [activeItem, setActiveItem] = useState(null);
      const [focusedIndex, setFocusedIndex] = useState(0);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');

      const fetchJsonViaProxy = async (actionUrl) => {
        const res = await fetch(`/proxy?url=${encodeURIComponent(actionUrl)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      };

      const connectWithPlaylist = async (pl) => {
        setLoading(true);
        try {
          // AUTO-DETECCIÓN INTELIGENTE: Si el M3U es un enlace get.php de Xtream Codes
          let targetType = pl.type;
          let targetHost = pl.host;
          let targetUser = pl.username;
          let targetPass = pl.password;

          if (targetType === 'M3U' && pl.m3uUrl) {
            const detected = extractXtreamFromUrl(pl.m3uUrl);
            if (detected) {
              targetType = 'XTREAM';
              targetHost = detected.host;
              targetUser = detected.username;
              targetPass = detected.password;
            }
          }

          if (targetType === 'M3U') {
            setLoadingStatus('Cargando lista M3U...');
            const res = await fetch(`/proxy?url=${encodeURIComponent(pl.m3uUrl)}`);
            const content = await res.text();
            const parsed = parseM3uPlaylist(content);
            setCategories(parsed.categories);
            setLiveCatalog(parsed.live);
            setMoviesCatalog(parsed.movies);
            setSeriesCatalog(parsed.series);
            if (parsed.live.length > 0) setActiveItem(parsed.live[0]);
            setAuth(true);
            return;
          }

          // CONEXIÓN DE ALTA VELOCIDAD VÍA API XTREAM
          const finalHost = (targetHost || OFFICIAL_SERVER_HOST).trim().replace(/\/+$/, '');
          setActiveServerHost(finalHost);
          setUsername(targetUser);
          setPassword(targetPass);

          const baseApi = `${finalHost}/player_api.php?username=${encodeURIComponent(targetUser)}&password=${encodeURIComponent(targetPass)}`;

          setLoadingStatus('Cargando categorías...');
          const [liveCats, vodCats, serCats] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_live_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_vod_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series_categories`).catch(() => [])
          ]);

          const liveCatMap = {};
          const vodCatMap = {};
          const serCatMap = {};

          if (Array.isArray(liveCats)) liveCats.forEach(c => { liveCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(vodCats)) vodCats.forEach(c => { vodCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(serCats)) serCats.forEach(c => { serCatMap[String(c.category_id)] = c.category_name; });

          setCategories({
            LIVE: Array.isArray(liveCats) ? liveCats : [],
            MOVIES: Array.isArray(vodCats) ? vodCats : [],
            SERIES: Array.isArray(serCats) ? serCats : []
          });

          setLoadingStatus('Cargando canales...');
          const liveData = await fetchJsonViaProxy(`${baseApi}&action=get_live_streams`);
          if (Array.isArray(liveData)) {
            const mappedLive = liveData.map((ch, idx) => ({
              type: 'LIVE',
              id: `live-${ch.stream_id || idx}`,
              streamId: ch.stream_id,
              title: ch.name || `Canal ${idx + 1}`,
              logo: ch.stream_icon || '',
              categoryId: String(ch.category_id || ''),
              categoryName: liveCatMap[String(ch.category_id || '')] || 'TV en Vivo',
              streamUrl: `${finalHost}/live/${targetUser}/${targetPass}/${ch.stream_id}.ts`
            }));
            setLiveCatalog(mappedLive);
            if (mappedLive.length > 0) setActiveItem(mappedLive[0]);
          }

          setLoadingStatus('Cargando catálogo de Cine y Series...');
          const [moviesData, seriesData] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_vod_streams`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series`).catch(() => [])
          ]);

          if (Array.isArray(moviesData)) {
            setMoviesCatalog(moviesData.map((m, idx) => ({
              type: 'MOVIE',
              id: `movie-${m.stream_id || idx}`,
              streamId: m.stream_id,
              title: m.name || `Película ${idx + 1}`,
              logo: m.stream_icon || '',
              categoryId: String(m.category_id || ''),
              categoryName: vodCatMap[String(m.category_id || '')] || 'Películas',
              streamUrl: `${finalHost}/movie/${targetUser}/${targetPass}/${m.stream_id}.${m.container_extension || 'mp4'}`
            })));
          }

          if (Array.isArray(seriesData)) {
            setSeriesCatalog(seriesData.map((s, idx) => ({
              type: 'SERIE',
              id: `serie-${s.series_id || idx}`,
              seriesId: s.series_id,
              title: s.name || `Serie ${idx + 1}`,
              logo: s.cover || '',
              categoryId: String(s.category_id || ''),
              categoryName: serCatMap[String(s.category_id || '')] || 'Series'
            })));
          }

          setAuth(true);
        } catch (err) {
          alert('Error al conectar con la lista: ' + err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
        }
      };

      const syncWithServer = async (autoConnect = true) => {
        try {
          const res = await fetch('/api/device/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId })
          });
          const data = await res.json();
          if (data.devicePin) setDevicePin(data.devicePin);
          if (data.access) setDeviceAccess(data.access);
          if (data.adminNotice?.active && data.adminNotice?.text) {
            setAdminNotice(data.adminNotice);
          }

          if (data.playlist) {
            if (autoConnect) {
              connectWithPlaylist(data.playlist);
            }
          }
        } catch (_) {}
      };

      useEffect(() => {
        syncWithServer(true);
      }, []);

      const handleManualLogin = (e) => {
        e.preventDefault();
        connectWithPlaylist({
          type: 'XTREAM',
          host: customHost || OFFICIAL_SERVER_HOST,
          username,
          password
        });
      };

      const toggleFavorite = (itemId, e) => {
        if (e) e.stopPropagation();
        setFavorites(prev => {
          const updated = prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId];
          localStorage.setItem('tvgo_favorites', JSON.stringify(updated));
          return updated;
        });
      };

      const handleSelectItem = async (item) => {
        if (!item) return;
        if (item.type === 'SERIE') {
          setSelectedSerieInfo(item);
          setSeriesEpisodes([]);
          setActiveItem(null);
          try {
            const infoUrl = `${activeServerHost}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series_info&series_id=${item.seriesId}`;
            const data = await fetchJsonViaProxy(infoUrl);
            const episodesObj = data?.episodes || {};
            const epList = [];
            Object.keys(episodesObj).forEach((seasonNum) => {
              const seasonArr = episodesObj[seasonNum] || [];
              seasonArr.forEach((ep) => {
                const ext = ep.container_extension || 'mp4';
                epList.push({
                  type: 'EPISODE',
                  id: `ep-${ep.id}`,
                  streamId: ep.id,
                  title: `${item.title} - T${seasonNum}:E${ep.episode_num} - ${ep.title || 'Capítulo'}`,
                  ext,
                  streamUrl: `${activeServerHost}/series/${username}/${password}/${ep.id}.${ext}`
                });
              });
            });
            setSeriesEpisodes(epList);
          } catch (_) {
            alert('No se pudieron obtener los capítulos.');
          }
        } else {
          setActiveItem(item);
        }
      };

      const currentCatalog = useMemo(() => {
        if (activeTab === 'LIVE') return liveCatalog;
        if (activeTab === 'MOVIES') return moviesCatalog;
        if (activeTab === 'SERIES') return seriesCatalog;
        return [];
      }, [activeTab, liveCatalog, moviesCatalog, seriesCatalog]);

      const currentCategories = useMemo(() => categories[activeTab] || [], [categories, activeTab]);
      const currentTabFavorites = useMemo(() => currentCatalog.filter(item => favorites.includes(item.id)), [currentCatalog, favorites]);

      const filteredItems = useMemo(() => {
        let list = currentCatalog;
        if (selectedCategory === 'FAVORITES') list = currentTabFavorites;
        else if (selectedCategory !== 'ALL') list = list.filter(item => String(item.categoryId) === String(selectedCategory));
        const q = search.trim().toLowerCase();
        if (q) list = list.filter(item => item.title.toLowerCase().includes(q));
        return list;
      }, [currentCatalog, currentTabFavorites, selectedCategory, search]);

      const visibleItems = useMemo(() => filteredItems.slice(0, visibleLimit), [filteredItems, visibleLimit]);

      const handleTabChange = (newTab) => {
        setActiveTab(newTab);
        setSelectedCategory('ALL');
        setSearch('');
        setVisibleLimit(80);
        setSeriesEpisodes([]);
        setSelectedSerieInfo(null);
        if (newTab === 'LIVE' && liveCatalog.length > 0) setActiveItem(liveCatalog[0]);
        else setActiveItem(null);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#060811]">
          {/* HEADER OTT */}
          <header className="sticky top-0 z-50 backdrop-blur-xl bg-[#080B16]/95 border-b border-slate-800/80 px-4 lg:px-7 py-3 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-purple-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-violet-600/30">
                TV
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black tracking-tight text-white">Full Premium <span className="bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">TvGo</span></span>
                  <span className="px-2 py-0.5 text-[9px] font-extrabold uppercase tracking-wider bg-violet-500/10 text-violet-300 border border-violet-500/20 rounded-full">Studio</span>
                </div>
                <div className="text-[11px] text-slate-400 font-medium">Dispositivo: <span className="font-mono text-slate-200">{deviceId}</span></div>
              </div>
            </div>

            {auth && (
              <nav className="flex items-center bg-slate-900/90 p-1 rounded-2xl border border-slate-800 shadow-xl gap-1">
                <button onClick={() => handleTabChange('LIVE')} className={`px-4 py-2 rounded-xl font-bold text-xs transition flex items-center gap-2 ${activeTab === 'LIVE' ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                  <span>📺</span> En Vivo <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-black/40 font-mono">{liveCatalog.length}</span>
                </button>
                <button onClick={() => handleTabChange('MOVIES')} className={`px-4 py-2 rounded-xl font-bold text-xs transition flex items-center gap-2 ${activeTab === 'MOVIES' ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                  <span>🍿</span> Cine <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-black/40 font-mono">{moviesCatalog.length}</span>
                </button>
                <button onClick={() => handleTabChange('SERIES')} className={`px-4 py-2 rounded-xl font-bold text-xs transition flex items-center gap-2 ${activeTab === 'SERIES' ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                  <span>📂</span> Series <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-black/40 font-mono">{seriesCatalog.length}</span>
                </button>
              </nav>
            )}

            <div className="flex items-center gap-2.5">
              <a
                href="/client.html"
                target="_blank"
                className="px-3.5 py-2 rounded-xl bg-violet-600/20 hover:bg-violet-600/30 border border-violet-500/40 text-violet-300 text-xs font-bold transition flex items-center gap-1.5"
              >
                <span>📱</span> Portal Cliente (Cargar Lista)
              </a>

              {auth && (
                <button onClick={() => setAuth(false)} className="px-3 py-2 rounded-xl bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 text-xs font-bold text-rose-300">
                  Desconectar
                </button>
              )}
            </div>
          </header>

          {/* COMUNICADO GLOBAL */}
          {adminNotice && !dismissedNotice && (
            <div className="bg-gradient-to-r from-violet-900 via-indigo-900 to-purple-900 border-b border-violet-500/50 px-4 py-2.5 flex items-center justify-between text-xs text-white shadow-xl">
              <div className="flex items-center gap-2.5 max-w-4xl mx-auto">
                <span className="text-base animate-pulse">📢</span>
                <span><strong>Aviso:</strong> {adminNotice.text}</span>
              </div>
              <button onClick={() => setDismissedNotice(true)} className="px-2 py-0.5 rounded-lg bg-black/40 text-slate-300 text-[11px] font-bold">✕</button>
            </div>
          )}

          {/* CUERPO PRINCIPAL */}
          <main className="flex-1 w-full max-w-[1850px] mx-auto p-3 sm:p-5">
            {!auth ? (
              /* PANTALLA DE BIENVENIDA / EMPAREJAMIENTO */
              <div className="max-w-2xl mx-auto mt-8 bg-[#0A0D1A] border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 bg-gradient-to-tr from-violet-600 to-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl mx-auto shadow-lg shadow-violet-600/30">
                    TV
                  </div>
                  <h2 className="text-2xl font-black text-white">Full Premium TvGo</h2>
                  <p className="text-xs text-slate-400 max-w-md mx-auto">
                    Tu pantalla está lista. Gestiona tus listas y canales desde tu celular o computadora.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
                    <span className="text-[11px] font-extrabold uppercase text-slate-400">ID de esta Pantalla</span>
                    <div className="text-lg font-mono font-black text-violet-400 select-all tracking-wider">{deviceId}</div>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-1">
                    <span className="text-[11px] font-extrabold uppercase text-slate-400">Tu Clave PIN</span>
                    <div className="text-2xl font-mono font-black text-emerald-400 tracking-widest">{devicePin}</div>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-violet-950/30 border border-violet-500/30 text-xs text-slate-300 space-y-2">
                  <div className="font-bold text-white flex items-center gap-1.5">
                    <span>📲</span> ¿Cómo cargar tus canales?
                  </div>
                  <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-300">
                    <li>Entra desde tu celular o PC a: <strong className="text-violet-300">app.fullpremiumtvcl.com/client.html</strong></li>
                    <li>Escribe tu <strong>ID</strong> y <strong>PIN</strong>.</li>
                    <li>Guarda tu cuenta y pulsa el botón de abajo.</li>
                  </ol>
                </div>

                <div className="space-y-3 pt-2">
                  <button
                    onClick={() => syncWithServer(true)}
                    disabled={loading}
                    className="w-full py-4 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 text-white font-black text-sm shadow-xl transition flex items-center justify-center gap-2"
                  >
                    <span>🔄</span> {loading ? loadingStatus : 'Sincronizar y Entrar'}
                  </button>

                  <div className="text-center">
                    <button
                      onClick={() => setManualMode(!manualMode)}
                      className="text-xs text-slate-400 hover:text-white transition underline"
                    >
                      {manualMode ? 'Ocultar ingreso manual' : '¿Prefieres ingresar tus datos manualmente en este equipo?'}
                    </button>
                  </div>
                </div>

                {manualMode && (
                  <form onSubmit={handleManualLogin} className="pt-4 border-t border-slate-800 space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">Servidor Xtream (Opcional si usas el oficial)</label>
                      <input
                        type="url"
                        placeholder="http://servidor.com:8080"
                        value={customHost}
                        onChange={e => setCustomHost(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">Usuario</label>
                        <input
                          type="text"
                          value={username}
                          onChange={e => setUsername(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">Contraseña</label>
                        <input
                          type="password"
                          value={password}
                          onChange={e => setPassword(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white"
                          required
                        />
                      </div>
                    </div>
                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold"
                    >
                      Conectar Manualmente
                    </button>
                  </form>
                )}
              </div>
            ) : activeTab === 'LIVE' ? (
              /* REPRODUCTOR DE TV EN VIVO */
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                <aside className="lg:col-span-3 bg-[#090C18] border border-slate-800/80 rounded-3xl p-3.5 flex flex-col h-[750px] shadow-2xl">
                  <div className="pb-3 border-b border-slate-800/80 mb-2 px-2 flex items-center justify-between">
                    <span className="text-[10px] font-black uppercase tracking-widest text-violet-400">Categorías</span>
                    <span className="text-[10px] font-mono text-slate-500">{currentCategories.length + 2}</span>
                  </div>
                  <div className="flex-1 overflow-y-auto space-y-1 pr-1">
                    <button
                      onClick={() => { setSelectedCategory('FAVORITES'); setVisibleLimit(80); }}
                      className={`w-full text-left px-3.5 py-2.5 rounded-2xl text-xs font-bold transition flex items-center justify-between ${
                        selectedCategory === 'FAVORITES' ? 'bg-amber-500 text-slate-950 font-black' : 'text-slate-300 hover:bg-slate-800/60'
                      }`}
                    >
                      <span>⭐ Mis Canales</span>
                      <span className="text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-black/30 font-bold">{currentTabFavorites.length}</span>
                    </button>
                    <button
                      onClick={() => { setSelectedCategory('ALL'); setVisibleLimit(80); }}
                      className={`w-full text-left px-3.5 py-2.5 rounded-2xl text-xs font-bold transition flex items-center justify-between ${
                        selectedCategory === 'ALL' ? 'bg-violet-600 text-white font-black' : 'text-slate-300 hover:bg-slate-800/60'
                      }`}
                    >
                      <span>🌐 Todos los Canales</span>
                      <span className="text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-black/30">{currentCatalog.length}</span>
                    </button>
                    {currentCategories.map(cat => (
                      <button
                        key={cat.category_id}
                        onClick={() => { setSelectedCategory(String(cat.category_id)); setVisibleLimit(80); }}
                        className={`w-full text-left px-3.5 py-2 rounded-2xl text-xs font-semibold transition truncate flex items-center justify-between ${
                          selectedCategory === String(cat.category_id) ? 'bg-violet-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                        }`}
                      >
                        <span className="truncate">{cat.category_name}</span>
                      </button>
                    ))}
                  </div>
                </aside>

                <section className="lg:col-span-4 bg-[#090C18] border border-slate-800/80 rounded-3xl p-3.5 flex flex-col h-[750px] shadow-2xl">
                  <div className="mb-3">
                    <input
                      type="text"
                      placeholder="Buscar canal..."
                      value={search}
                      onChange={e => { setSearch(e.target.value); setVisibleLimit(80); }}
                      className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-950/80 border border-slate-800 text-xs text-white focus:outline-none focus:border-violet-500"
                    />
                  </div>
                  <div className="flex-1 overflow-y-auto space-y-1.5 pr-1">
                    {visibleItems.map((item, idx) => {
                      const isFav = favorites.includes(item.id);
                      const isSelected = activeItem?.id === item.id;
                      return (
                        <div
                          key={item.id}
                          onClick={() => { setFocusedIndex(idx); handleSelectItem(item); }}
                          className={`p-2.5 rounded-2xl cursor-pointer transition flex items-center justify-between gap-3 ${
                            isSelected ? 'bg-violet-600/30 border border-violet-500/70 shadow-lg text-white' : 'hover:bg-slate-800/40 text-slate-300'
                          }`}
                        >
                          <div className="flex items-center gap-2.5 min-w-0">
                            <button onClick={(e) => toggleFavorite(item.id, e)} className="text-sm">
                              {isFav ? '⭐' : '☆'}
                            </button>
                            <div className="w-8 h-8 rounded-xl bg-slate-950 p-1 flex items-center justify-center shrink-0 border border-slate-800">
                              {item.logo ? <img src={item.logo} alt="" className="w-full h-full object-contain" onError={e => { e.target.style.display = 'none'; }} /> : <span className="text-[9px] font-black text-violet-400">TV</span>}
                            </div>
                            <div className="text-xs font-bold truncate">{item.title}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                <section className="lg:col-span-5 bg-[#090C18] border border-slate-800/80 rounded-3xl p-4 flex flex-col shadow-2xl">
                  <VideoPlayer item={activeItem} />
                  {activeItem && (
                    <div className="mt-4 p-4 rounded-2xl bg-slate-950/80 border border-slate-800/80 flex items-center justify-between">
                      <div className="min-w-0">
                        <h3 className="text-sm font-black text-white truncate">{activeItem.title}</h3>
                        <p className="text-[11px] text-slate-400 truncate">{activeItem.categoryName}</p>
                      </div>
                      <button onClick={(e) => toggleFavorite(activeItem.id, e)} className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold">
                        {favorites.includes(activeItem.id) ? '⭐ Guardado' : '☆ Favorito'}
                      </button>
                    </div>
                  )}
                </section>
              </div>
            ) : (
              /* CINE Y SERIES */
              <div className="space-y-6">
                {activeItem && (activeItem.type === 'MOVIE' || activeItem.type === 'EPISODE') && (
                  <div className="max-w-6xl mx-auto bg-[#090C18] border border-slate-800/80 rounded-3xl p-5 space-y-4 shadow-2xl">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                      <button onClick={() => setActiveItem(null)} className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-300">
                        ← Volver al Catálogo
                      </button>
                      <a href={activeItem.streamUrl} target="_blank" rel="noreferrer" className="px-3.5 py-2 rounded-xl bg-violet-600/20 text-violet-300 border border-violet-500/30 text-xs font-bold">
                        🚀 Abrir en VLC / App Externa
                      </a>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                      <div className={seriesEpisodes.length > 0 ? "lg:col-span-8" : "lg:col-span-12"}>
                        <VideoPlayer item={activeItem} />
                      </div>
                      {seriesEpisodes.length > 0 && (
                        <div className="lg:col-span-4 bg-slate-950/80 border border-slate-800 rounded-2xl p-3 flex flex-col h-[460px]">
                          <div className="pb-2 border-b border-slate-800 mb-2 font-bold text-xs text-violet-400">
                            Capítulos ({seriesEpisodes.length})
                          </div>
                          <div className="flex-1 overflow-y-auto space-y-1.5 pr-1">
                            {seriesEpisodes.map((ep) => (
                              <button
                                key={ep.id}
                                onClick={() => setActiveItem(ep)}
                                className={`w-full p-2.5 rounded-xl text-left text-xs font-semibold truncate transition ${
                                  activeItem?.id === ep.id ? 'bg-violet-600 text-white font-bold' : 'bg-slate-900/60 text-slate-300'
                                }`}
                              >
                                ▶ {ep.title}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {!activeItem && selectedSerieInfo && seriesEpisodes.length > 0 && (
                  <div className="max-w-4xl mx-auto bg-[#090C18] border border-violet-500/40 rounded-3xl p-6 shadow-2xl space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                      <div>
                        <h3 className="text-base font-black text-white">{selectedSerieInfo.title}</h3>
                        <p className="text-xs text-slate-400">Selecciona el capítulo que deseas reproducir:</p>
                      </div>
                      <button onClick={() => setSelectedSerieInfo(null)} className="px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">
                        ✕ Cerrar
                      </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-96 overflow-y-auto pr-1">
                      {seriesEpisodes.map((ep) => (
                        <button
                          key={ep.id}
                          onClick={() => setActiveItem(ep)}
                          className="p-3 rounded-2xl bg-slate-900/90 hover:bg-violet-600/30 border border-slate-800 hover:border-violet-500/60 text-left text-xs font-semibold text-slate-200 transition truncate"
                        >
                          ▶ {ep.title}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                    <button
                      onClick={() => { setSelectedCategory('FAVORITES'); setVisibleLimit(80); }}
                      className={`px-3.5 py-2 rounded-xl font-bold whitespace-nowrap transition ${
                        selectedCategory === 'FAVORITES' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}
                    >
                      ⭐ Mi Lista ({currentTabFavorites.length})
                    </button>
                    <button
                      onClick={() => { setSelectedCategory('ALL'); setVisibleLimit(80); }}
                      className={`px-3.5 py-2 rounded-xl font-bold whitespace-nowrap transition ${
                        selectedCategory === 'ALL' ? 'bg-violet-600 text-white font-bold' : 'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}
                    >
                      Todos ({currentCatalog.length})
                    </button>
                    {currentCategories.slice(0, 14).map(cat => (
                      <button
                        key={cat.category_id}
                        onClick={() => { setSelectedCategory(String(cat.category_id)); setVisibleLimit(80); }}
                        className={`px-3.5 py-2 rounded-xl font-bold whitespace-nowrap transition ${
                          selectedCategory === String(cat.category_id) ? 'bg-violet-600 text-white font-bold' : 'bg-slate-900 text-slate-300 border border-slate-800'
                        }`}
                      >
                        {cat.category_name}
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    placeholder="Buscar por título..."
                    value={search}
                    onChange={e => { setSearch(e.target.value); setVisibleLimit(80); }}
                    className="w-full sm:w-72 px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white"
                  />
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
                  {visibleItems.map(item => (
                    <div
                      key={item.id}
                      onClick={() => handleSelectItem(item)}
                      className="group relative rounded-2xl overflow-hidden cursor-pointer border border-slate-800/80 bg-slate-900 transition hover:-translate-y-1.5 hover:shadow-2xl hover:border-violet-500/80"
                    >
                      <div className="aspect-[2/3] w-full bg-slate-950 overflow-hidden relative">
                        {item.logo ? <img src={item.logo} alt="" className="w-full h-full object-cover group-hover:scale-105 transition" loading="lazy" onError={e => { e.target.style.display = 'none'; }} /> : <div className="w-full h-full flex items-center justify-center text-3xl font-bold text-slate-700">🎬</div>}
                        <button onClick={(e) => toggleFavorite(item.id, e)} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/70 flex items-center justify-center text-xs shadow-lg">
                          {favorites.includes(item.id) ? '⭐' : '☆'}
                        </button>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#060811] via-transparent to-transparent flex flex-col justify-end p-2.5">
                          <div className="text-xs font-bold text-white line-clamp-2">{item.title}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function VideoPlayer({ item }) {
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const [status, setStatus] = useState('IDLE');

      const cleanup = () => {
        if (playerRef.current) {
          try { playerRef.current.destroy(); } catch (_) {}
          playerRef.current = null;
        }
        if (videoRef.current) {
          try {
            videoRef.current.pause();
            videoRef.current.removeAttribute('src');
            videoRef.current.load();
          } catch (_) {}
        }
      };

      const startPlayback = () => {
        if (!item?.streamUrl || !videoRef.current) return;
        cleanup();
        setStatus('LOADING');

        const video = videoRef.current;
        video.muted = false;
        video.volume = 1.0;

        const directProxyUrl = `${window.location.origin}/proxy?url=${encodeURIComponent(item.streamUrl)}`;

        if (item.type === 'LIVE') {
          if (window.mpegts && window.mpegts.isSupported()) {
            try {
              const player = window.mpegts.createPlayer({
                type: 'm2ts',
                isLive: true,
                url: directProxyUrl,
                cors: true
              }, {
                enableWorker: true,
                lazyLoad: false,
                enableStashBuffer: false,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true
              });

              playerRef.current = player;
              player.attachMediaElement(video);
              player.load();
              player.play().then(() => setStatus('PLAYING')).catch(() => {
                video.muted = true;
                player.play().catch(() => {});
                setStatus('PLAYING');
              });
            } catch (_) {
              setStatus('ERROR');
            }
          } else {
            video.src = directProxyUrl;
            video.load();
            video.play().catch(() => {});
          }
        } else {
          video.src = directProxyUrl;
          video.load();
          video.play().then(() => setStatus('PLAYING')).catch(() => setStatus('PLAYING'));
        }
      };

      useEffect(() => {
        startPlayback();
        return () => cleanup();
      }, [item]);

      return (
        <div className="bg-black rounded-3xl overflow-hidden shadow-2xl relative border border-slate-800/90 w-full flex flex-col justify-center">
          <div className="relative aspect-video bg-black flex items-center justify-center">
            <video ref={videoRef} controls playsInline autoPlay crossOrigin="anonymous" className="w-full h-full object-contain" />
            {status === 'LOADING' && (
              <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center pointer-events-none">
                <div className="w-10 h-10 border-3 border-violet-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <span className="text-xs text-violet-300 font-bold">Cargando transmisión...</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
