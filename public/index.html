<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Full Premium TvGo — Plataforma OTT</title>
  <meta name="theme-color" content="#060811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(8, 12, 22, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.8); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button:focus,
    button:focus-visible,
    a:focus,
    a:focus-visible,
    input:focus,
    input:focus-visible,
    [tabindex="0"]:focus,
    [tabindex="0"]:focus-visible {
      outline: 3px solid #a78bfa !important;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(139, 92, 246, 0.35) !important;
    }
  </style>
</head>
<body class="bg-[#060811] text-slate-100 min-h-screen selection:bg-violet-600 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OFFICIAL_SERVER_HOST = 'http://st.xn--aejo-gqa.de:80';

    function getOrCreateDeviceId() {
      let id = '';
      try {
        id = localStorage.getItem('tvgo_device_id') || '';
      } catch (_) {}
      if (!/^TVGO-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(id)) {
        const rand = () => Math.random().toString(36).substring(2, 6).toUpperCase().padEnd(4, 'X');
        id = `TVGO-${rand()}-${rand()}`;
        try {
          localStorage.setItem('tvgo_device_id', id);
        } catch (_) {}
      }
      return id;
    }

    function moveDpadFocus(direction) {
      const selector = 'button:not(:disabled), a[href], input:not(:disabled), [tabindex="0"]';
      const candidates = Array.from(document.querySelectorAll(selector)).filter((el) => {
        if (el.offsetParent === null) return false;
        const rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
      if (candidates.length === 0) return false;

      const active = document.activeElement;
      if (!active || active === document.body || !candidates.includes(active)) {
        candidates[0].focus();
        candidates[0].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        return true;
      }

      const cur = active.getBoundingClientRect();
      const cx = cur.left + cur.width / 2;
      const cy = cur.top + cur.height / 2;

      let best = null;
      let bestScore = Infinity;

      for (const el of candidates) {
        if (el === active) continue;
        const r = el.getBoundingClientRect();
        const ex = r.left + r.width / 2;
        const ey = r.top + r.height / 2;
        const dx = ex - cx;
        const dy = ey - cy;

        let valid = false;
        let primary = 0;
        let secondary = 0;

        if (direction === 37 && dx < -4) { valid = true; primary = -dx; secondary = Math.abs(dy); }
        else if (direction === 39 && dx > 4) { valid = true; primary = dx; secondary = Math.abs(dy); }
        else if (direction === 38 && dy < -4) { valid = true; primary = -dy; secondary = Math.abs(dx); }
        else if (direction === 40 && dy > 4) { valid = true; primary = dy; secondary = Math.abs(dx); }

        if (!valid) continue;
        const score = primary + secondary * 2.2;
        if (score < bestScore) {
          bestScore = score;
          best = el;
        }
      }

      if (best) {
        best.focus();
        best.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        return true;
      }
      return false;
    }

    function extractXtreamFromUrl(rawUrl) {
      if (!rawUrl) return null;
      try {
        const uMatch = rawUrl.match(/[?&]username=([^&]+)/i);
        const pMatch = rawUrl.match(/[?&]password=([^&]+)/i);
        const hostMatch = rawUrl.match(/^(https?:\/\/[^\/?#]+)/i);
        if (uMatch && pMatch && hostMatch) {
          return {
            host: hostMatch[1],
            username: decodeURIComponent(uMatch[1]),
            password: decodeURIComponent(pMatch[1])
          };
        }
      } catch (_) {}
      return null;
    }

    function detectTvPlatform() {
      try {
        if (window.AndroidTvBridge) return 'ANDROID_TV';
        if (typeof window.tizen !== 'undefined') return 'SAMSUNG_TIZEN';
        if (typeof window.webOS !== 'undefined') return 'LG_WEBOS';
        const ua = navigator.userAgent || '';
        if (/Tizen/i.test(ua)) return 'SAMSUNG_TIZEN';
        if (/Web0S|webOS/i.test(ua)) return 'LG_WEBOS';
        if (/Android TV|GoogleTV|AFT[A-Z0-9]+|SmartTV|BRAVIA/i.test(ua)) return 'ANDROID_TV';
      } catch (_) {}
      return 'WEB';
    }

    function registerTizenRemoteKeys() {
      try {
        if (window.tizen && window.tizen.tvinputdevice && typeof window.tizen.tvinputdevice.registerKey === 'function') {
          const keys = [
            'MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop',
            'MediaRewind', 'MediaFastForward', 'ChannelUp', 'ChannelDown',
            'ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue'
          ];
          keys.forEach((k) => {
            try { window.tizen.tvinputdevice.registerKey(k); } catch (_) {}
          });
        }
      } catch (_) {}
    }

    function exitTvApp() {
      try {
        if (window.AndroidTvBridge && typeof window.AndroidTvBridge.exitApp === 'function') {
          window.AndroidTvBridge.exitApp();
          return true;
        }
      } catch (_) {}
      try {
        if (window.tizen && window.tizen.application && typeof window.tizen.application.getCurrentApplication === 'function') {
          window.tizen.application.getCurrentApplication().exit();
          return true;
        }
      } catch (_) {}
      try {
        if (window.webOS && typeof window.webOS.platformBack === 'function') {
          window.webOS.platformBack();
          return true;
        }
      } catch (_) {}
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'TVGO_EXIT_APP' }, '*');
          return true;
        }
      } catch (_) {}
      try {
        const platform = detectTvPlatform();
        if (platform === 'LG_WEBOS' || platform === 'SAMSUNG_TIZEN') {
          window.close();
          return true;
        }
      } catch (_) {}
      return false;
    }

    function App() {
      const [tvPlatform] = useState(detectTvPlatform);
      const isSmartTv = tvPlatform !== 'WEB';
      const [deviceId] = useState(getOrCreateDeviceId);
      const [devicePin, setDevicePin] = useState(() => localStorage.getItem('tvgo_device_pin') || '----');
      const [deviceAccess, setDeviceAccess] = useState({ allowed: true, status: 'TRIAL', daysLeft: 12 });

      const [adminNotice, setAdminNotice] = useState(null);
      const [dismissedNotice, setDismissedNotice] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('tvgo_favorites') || '[]');
        } catch (_) {
          return [];
        }
      });

      const [activeServerHost, setActiveServerHost] = useState(OFFICIAL_SERVER_HOST);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');

      const [auth, setAuth] = useState(false);
      const [activeTab, setActiveTab] = useState('LIVE');
      const [categories, setCategories] = useState({ LIVE: [], MOVIES: [], SERIES: [] });
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const [liveCatalog, setLiveCatalog] = useState([]);
      const [moviesCatalog, setMoviesCatalog] = useState([]);
      const [seriesCatalog, setSeriesCatalog] = useState([]);

      const [visibleLimit, setVisibleLimit] = useState(80);
      const [seriesEpisodes, setSeriesEpisodes] = useState([]);
      const [selectedSerieInfo, setSelectedSerieInfo] = useState(null);

      const [activeItem, setActiveItem] = useState(null);
      const [focusedIndex, setFocusedIndex] = useState(0);
      const [search, setSearch] = useState('');
      const [catSearch, setCatSearch] = useState('');
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');

      const fetchJsonViaProxy = async (actionUrl) => {
        const res = await fetch(`/proxy?url=${encodeURIComponent(actionUrl)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      };

      const connectWithPlaylist = async (pl) => {
        setLoading(true);
        try {
          let targetType = pl.type;
          let targetHost = pl.host;
          let targetUser = pl.username;
          let targetPass = pl.password;

          if (targetType === 'M3U' && pl.m3uUrl) {
            const detected = extractXtreamFromUrl(pl.m3uUrl);
            if (detected) {
              targetType = 'XTREAM';
              targetHost = detected.host;
              targetUser = detected.username;
              targetPass = detected.password;
            }
          }

          const finalHost = (targetHost || OFFICIAL_SERVER_HOST).trim().replace(/\/+$/, '');
          setActiveServerHost(finalHost);
          setUsername(targetUser);
          setPassword(targetPass);

          const baseApi = `${finalHost}/player_api.php?username=${encodeURIComponent(targetUser)}&password=${encodeURIComponent(targetPass)}`;

          setLoadingStatus('Cargando categorías...');
          const [liveCats, vodCats, serCats] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_live_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_vod_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series_categories`).catch(() => [])
          ]);

          const liveCatMap = {};
          const vodCatMap = {};
          const serCatMap = {};

          if (Array.isArray(liveCats)) liveCats.forEach(c => { liveCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(vodCats)) vodCats.forEach(c => { vodCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(serCats)) serCats.forEach(c => { serCatMap[String(c.category_id)] = c.category_name; });

          setCategories({
            LIVE: Array.isArray(liveCats) ? liveCats : [],
            MOVIES: Array.isArray(vodCats) ? vodCats : [],
            SERIES: Array.isArray(serCats) ? serCats : []
          });

          setLoadingStatus('Cargando canales en vivo...');
          const liveData = await fetchJsonViaProxy(`${baseApi}&action=get_live_streams`);
          if (Array.isArray(liveData)) {
            const mappedLive = liveData.map((ch, idx) => ({
              type: 'LIVE',
              id: `live-${ch.stream_id || idx}`,
              streamId: ch.stream_id,
              title: ch.name || `Canal ${idx + 1}`,
              logo: ch.stream_icon || '',
              categoryId: String(ch.category_id || ''),
              categoryName: liveCatMap[String(ch.category_id || '')] || 'TV en Vivo',
              streamUrl: `${finalHost}/live/${targetUser}/${targetPass}/${ch.stream_id}.ts`
            }));
            setLiveCatalog(mappedLive);
            if (mappedLive.length > 0) setActiveItem(mappedLive[0]);
          }

          setLoadingStatus('Cargando catálogo de Cine y Series...');
          const [moviesData, seriesData] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_vod_streams`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series`).catch(() => [])
          ]);

          if (Array.isArray(moviesData)) {
            setMoviesCatalog(moviesData.map((m, idx) => ({
              type: 'MOVIE',
              id: `movie-${m.stream_id || idx}`,
              streamId: m.stream_id,
              title: m.name || `Película ${idx + 1}`,
              logo: m.stream_icon || '',
              categoryId: String(m.category_id || ''),
              categoryName: vodCatMap[String(m.category_id || '')] || 'Películas',
              streamUrl: `${finalHost}/movie/${targetUser}/${targetPass}/${m.stream_id}.${m.container_extension || 'mp4'}`
            })));
          }

          if (Array.isArray(seriesData)) {
            setSeriesCatalog(seriesData.map((s, idx) => ({
              type: 'SERIE',
              id: `serie-${s.series_id || idx}`,
              seriesId: s.series_id,
              title: s.name || `Serie ${idx + 1}`,
              logo: s.cover || '',
              categoryId: String(s.category_id || ''),
              categoryName: serCatMap[String(s.category_id || '')] || 'Series'
            })));
          }

          setAuth(true);
        } catch (err) {
          alert('Error al conectar con la lista: ' + err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
        }
      };

      const authRef = useRef(auth);
      useEffect(() => { authRef.current = auth; }, [auth]);

      const syncWithServer = async (autoConnect = true) => {
        try {
          const res = await fetch('/api/device/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId })
          });
          const data = await res.json();
          if (data.devicePin) {
            setDevicePin(data.devicePin);
            localStorage.setItem('tvgo_device_pin', data.devicePin);
          }
          if (data.access) {
            setDeviceAccess(data.access);
            if (!data.access.allowed) {
              setActiveItem(null);
              setAuth(false);
            }
          }

          if (data.adminNotice?.active && data.adminNotice?.text) {
            setAdminNotice(data.adminNotice);
            setDismissedNotice(false);
          } else {
            setAdminNotice(null);
          }

          if (data.playlist && data.access?.allowed !== false && autoConnect && !authRef.current) {
            connectWithPlaylist(data.playlist);
          }
        } catch (_) {}
      };

      useEffect(() => {
        registerTizenRemoteKeys();
        syncWithServer(true);
        // Polling cada 30 segundos para recibir mensajes o cambios de lista remotos
        const interval = setInterval(() => {
          syncWithServer(false);
        }, 30000);
        return () => clearInterval(interval);
      }, []);

      const filteredItemsRef = useRef([]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          const keyCode = e.keyCode || e.which;
          const activeEl = document.activeElement;
          const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');

          const isBackKey = (
            keyCode === 4 ||
            keyCode === 461 ||
            keyCode === 10009 ||
            keyCode === 27 ||
            (keyCode === 8 && !isInput) ||
            e.key === 'Escape' ||
            e.key === 'GoBack' ||
            e.key === 'BrowserBack'
          );

          if (isBackKey) {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              e.preventDefault();
              if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
              else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
              return;
            }
            if (adminNotice && !dismissedNotice) {
              e.preventDefault();
              setDismissedNotice(true);
              return;
            }
            if (activeItem) {
              e.preventDefault();
              setActiveItem(null);
              return;
            }
            if (selectedSerieInfo) {
              e.preventDefault();
              setSelectedSerieInfo(null);
              setSeriesEpisodes([]);
              return;
            }
            if (auth && activeTab !== 'LIVE') {
              e.preventDefault();
              handleTabChange('LIVE');
              return;
            }
            if (exitTvApp()) {
              e.preventDefault();
            }
            return;
          }

          // Teclas multimedia Smart TV (Samsung Tizen, LG webOS, Google TV)
          const activeVideo = document.querySelector('video');
          if (activeVideo && !isInput) {
            if (keyCode === 415 || e.key === 'MediaPlay') {
              e.preventDefault();
              activeVideo.play().catch(() => {});
              return;
            }
            if (keyCode === 19 || e.key === 'MediaPause') {
              e.preventDefault();
              activeVideo.pause();
              return;
            }
            if (keyCode === 179 || keyCode === 10252 || e.key === 'MediaPlayPause') {
              e.preventDefault();
              if (activeVideo.paused) activeVideo.play().catch(() => {});
              else activeVideo.pause();
              return;
            }
            if (keyCode === 413 || e.key === 'MediaStop') {
              e.preventDefault();
              setActiveItem(null);
              return;
            }
            if (keyCode === 406 || e.key === 'f' || e.key === 'F') {
              e.preventDefault();
              const container = activeVideo.parentElement || activeVideo;
              if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
              } else if (container.requestFullscreen) {
                container.requestFullscreen().catch(() => {});
              } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
              }
              return;
            }
          }

          // Cambio rápido de canal (Channel Up / Down o PageUp / PageDown) en TV en Vivo
          if (auth && activeTab === 'LIVE' && !isInput && (keyCode === 427 || keyCode === 428 || keyCode === 33 || keyCode === 34)) {
            const list = filteredItemsRef.current || [];
            if (list.length > 0) {
              e.preventDefault();
              const curIdx = activeItem ? list.findIndex((it) => it.id === activeItem.id) : -1;
              const isNext = (keyCode === 427 || keyCode === 33);
              const nextIdx = curIdx < 0 ? 0 : (isNext ? (curIdx + 1) % list.length : (curIdx - 1 + list.length) % list.length);
              setActiveItem(list[nextIdx]);
              return;
            }
          }

          if (keyCode >= 37 && keyCode <= 40) {
            if (isInput && (keyCode === 37 || keyCode === 39)) return;
            e.preventDefault();
            moveDpadFocus(keyCode);
            return;
          }

          if (keyCode === 13 && activeEl && !isInput) {
            if (activeEl.tagName === 'DIV' || activeEl.getAttribute('tabindex') === '0') {
              e.preventDefault();
              activeEl.click();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [adminNotice, dismissedNotice, activeItem, selectedSerieInfo, auth, activeTab]);

      const toggleFavorite = (itemId, e) => {
        if (e) e.stopPropagation();
        setFavorites(prev => {
          const updated = prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId];
          localStorage.setItem('tvgo_favorites', JSON.stringify(updated));
          return updated;
        });
      };

      const handleSelectItem = async (item) => {
        if (!item) return;
        if (item.type === 'SERIE') {
          setSelectedSerieInfo(item);
          setSeriesEpisodes([]);
          setActiveItem(null);
          try {
            const infoUrl = `${activeServerHost}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series_info&series_id=${item.seriesId}`;
            const data = await fetchJsonViaProxy(infoUrl);
            const episodesObj = data?.episodes || {};
            const epList = [];
            Object.keys(episodesObj).forEach((seasonNum) => {
              const seasonArr = episodesObj[seasonNum] || [];
              seasonArr.forEach((ep) => {
                const ext = ep.container_extension || 'mp4';
                epList.push({
                  type: 'EPISODE',
                  id: `ep-${ep.id}`,
                  streamId: ep.id,
                  title: `${item.title} - T${seasonNum}:E${ep.episode_num} - ${ep.title || 'Capítulo'}`,
                  ext,
                  streamUrl: `${activeServerHost}/series/${username}/${password}/${ep.id}.${ext}`
                });
              });
            });
            setSeriesEpisodes(epList);
          } catch (_) {
            alert('No se pudieron obtener los capítulos.');
          }
        } else {
          setActiveItem(item);
        }
      };

      const currentCatalog = useMemo(() => {
        if (activeTab === 'LIVE') return liveCatalog;
        if (activeTab === 'MOVIES') return moviesCatalog;
        if (activeTab === 'SERIES') return seriesCatalog;
        return [];
      }, [activeTab, liveCatalog, moviesCatalog, seriesCatalog]);

      const currentCategories = useMemo(() => categories[activeTab] || [], [categories, activeTab]);

      const filteredCategories = useMemo(() => {
        const q = catSearch.trim().toLowerCase();
        if (!q) return currentCategories;
        return currentCategories.filter(cat => cat.category_name.toLowerCase().includes(q));
      }, [currentCategories, catSearch]);

      const currentTabFavorites = useMemo(() => {
        return currentCatalog.filter(item => favorites.includes(item.id));
      }, [currentCatalog, favorites]);

      const filteredItems = useMemo(() => {
        let list = currentCatalog;
        if (selectedCategory === 'FAVORITES') {
          list = currentTabFavorites;
        } else if (selectedCategory !== 'ALL') {
          list = list.filter(item => String(item.categoryId) === String(selectedCategory));
        }
        const q = search.trim().toLowerCase();
        if (q) {
          list = list.filter(item => item.title.toLowerCase().includes(q));
        }
        return list;
      }, [currentCatalog, currentTabFavorites, selectedCategory, search]);

      useEffect(() => {
        filteredItemsRef.current = filteredItems;
      }, [filteredItems]);

      const visibleItems = useMemo(() => filteredItems.slice(0, visibleLimit), [filteredItems, visibleLimit]);

      const handleTabChange = (newTab) => {
        setActiveTab(newTab);
        setSelectedCategory('ALL');
        setSearch('');
        setCatSearch('');
        setVisibleLimit(80);
        setSeriesEpisodes([]);
        setSelectedSerieInfo(null);
        if (newTab === 'LIVE' && liveCatalog.length > 0) setActiveItem(liveCatalog[0]);
        else setActiveItem(null);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#060811]">
          {/* HEADER OTT */}
          <header className="sticky top-0 z-50 backdrop-blur-xl bg-[#080B16]/95 border-b border-slate-800/80 px-4 lg:px-7 py-3 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-purple-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-violet-600/30">
                TV
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black tracking-tight text-white">Full Premium <span className="bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">TvGo</span></span>
                  <span className="px-2 py-0.5 text-[9px] font-extrabold uppercase tracking-wider bg-violet-500/10 text-violet-300 border border-violet-500/20 rounded-full">Studio</span>
                </div>
                <div className="text-[11px] text-slate-400 font-medium">Dispositivo: <span className="font-mono text-slate-200">{deviceId}</span></div>
              </div>
            </div>

            {auth && (
              <nav className="flex items-center bg-slate-900/90 p-1 rounded-2xl border border-slate-800 shadow-xl gap-1">

      );
    }

    // REPRODUCTOR BLINDADO CON SOPORTE PARA FHD CONTINUO Y LIMPIEZA ESTRICTA DE RAM
    function VideoPlayer({ item, isLiveMode }) {
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const hlsRef = useRef(null);
      const errorTimerRef = useRef(null);
      const [status, setStatus] = useState('IDLE');
      const [needsUnmute, setNeedsUnmute] = useState(false);

      const cleanup = () => {
        if (errorTimerRef.current) {
          clearTimeout(errorTimerRef.current);
          errorTimerRef.current = null;
        }
        if (hlsRef.current) {
          try {
            hlsRef.current.stopLoad();
            hlsRef.current.detachMedia();
            hlsRef.current.destroy();
          } catch (_) {}
          hlsRef.current = null;
        }
        if (playerRef.current) {
          try {
            playerRef.current.pause();
            playerRef.current.unload();
            playerRef.current.detachMediaElement();
            playerRef.current.destroy();
          } catch (_) {}
          playerRef.current = null;
        }
        if (videoRef.current) {
          try {
            videoRef.current.pause();
            videoRef.current.removeAttribute('src');
            videoRef.current.load();
          } catch (_) {}
        }
      };

      const attemptPlay = (target, video) => {
        const p = target.play();
        if (p && p.catch) {
          p.catch(() => {
            video.muted = true;
            setNeedsUnmute(true);
            const p2 = target.play();
            if (p2 && p2.catch) p2.catch(() => {});
          });
        }
      };

      const startPlayback = () => {
        cleanup();
        if (!item?.streamUrl || !videoRef.current) {
          setStatus('IDLE');
          return;
        }
        setStatus('LOADING');
        setNeedsUnmute(false);

        const video = videoRef.current;
        video.muted = false;
        video.volume = 1.0;

        const directProxyUrl = `${window.location.origin}/proxy?url=${encodeURIComponent(item.streamUrl)}`;
        const isHlsStream = /\.m3u8(\?|$)/i.test(item.streamUrl);

        if (isHlsStream && window.Hls && window.Hls.isSupported()) {
          try {
            const hls = new window.Hls({
              enableWorker: true,
              lowLatencyMode: Boolean(isLiveMode),
              maxBufferLength: 20,
              maxMaxBufferLength: 30,
              backBufferLength: 10
            });
            hlsRef.current = hls;
            hls.loadSource(directProxyUrl);
            hls.attachMedia(video);
            hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
              attemptPlay(video, video);
            });
            hls.on(window.Hls.Events.ERROR, (_, data) => {
              if (data && data.fatal) {
                setStatus('ERROR');
              }
            });
          } catch (_) {
            setStatus('ERROR');
          }
          return;
        }

        if (item.type === 'LIVE' && !isHlsStream) {
          if (window.mpegts && window.mpegts.isSupported()) {
            try {
              const player = window.mpegts.createPlayer({
                type: 'm2ts',
                isLive: true,
                url: directProxyUrl
              }, {
                enableWorker: true,
                lazyLoad: false,
                enableStashBuffer: true,
                stashInitialSize: 512 * 1024,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true,
                autoCleanupMaxBackwardDuration: 30,
                autoCleanupMinBackwardDuration: 15
              });

              playerRef.current = player;
              player.attachMediaElement(video);
              player.load();
              attemptPlay(player, video);

              player.on(window.mpegts.Events.ERROR, () => {
                if (video.currentTime > 0) return;
                if (errorTimerRef.current) clearTimeout(errorTimerRef.current);
                errorTimerRef.current = setTimeout(() => {
                  if (videoRef.current && videoRef.current.currentTime === 0) setStatus('ERROR');
                }, 7000);
              });
            } catch (_) {
              setStatus('ERROR');
            }
          } else {
            video.src = directProxyUrl;
            video.load();
            attemptPlay(video, video);
          }
        } else {
          video.src = directProxyUrl;
          video.load();
          attemptPlay(video, video);
        }
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handlePlaying = () => setStatus('PLAYING');
        const handleTimeUpdate = () => {
          if (video.currentTime > 0) {
            setStatus((prev) => (prev === 'LOADING' ? 'PLAYING' : prev));
          }
        };
        const handleError = () => {
          if (video.getAttribute('src')) setStatus('ERROR');
        };

        video.addEventListener('playing', handlePlaying);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('error', handleError);

        const handleUnload = () => cleanup();
        window.addEventListener('pagehide', handleUnload);
        window.addEventListener('beforeunload', handleUnload);

        return () => {
          video.removeEventListener('playing', handlePlaying);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('error', handleError);
          window.removeEventListener('pagehide', handleUnload);
          window.removeEventListener('beforeunload', handleUnload);
        };
      }, []);

      useEffect(() => {
        startPlayback();
        return () => cleanup();
      }, [item]);

      const handleUnmute = () => {
        if (videoRef.current) {
          videoRef.current.muted = false;
          videoRef.current.volume = 1.0;
          setNeedsUnmute(false);
          videoRef.current.play().catch(() => {});
        }
      };

      const handleFullscreen = () => {
        const container = videoRef.current?.parentElement || videoRef.current;
        if (!container) return;
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else if (container.requestFullscreen) {
          container.requestFullscreen().catch(() => {});
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      };

      return (
        <div className="bg-black rounded-3xl overflow-hidden shadow-2xl relative border border-slate-800/90 w-full flex flex-col justify-center">
          <div className="relative aspect-video bg-black flex items-center justify-center">
            <video
              ref={videoRef}
              controls
              playsInline
              autoPlay
              crossOrigin="anonymous"
              className="w-full h-full object-contain cursor-pointer"
              onClick={handleUnmute}
            />

            {status === 'PLAYING' && (
              <button
                onClick={handleFullscreen}
                title="Pantalla Completa (Tecla F o Botón Azul)"
                className="absolute bottom-14 right-4 z-20 px-3 py-1.5 rounded-xl bg-black/70 hover:bg-violet-600 border border-white/20 text-white font-bold text-xs shadow-xl transition"
              >
                ⛶ Pantalla Completa
              </button>
            )}

            {needsUnmute && (
              <button
                onClick={handleUnmute}
                className="absolute top-4 right-4 z-20 px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-2xl flex items-center gap-1.5 animate-bounce"
              >
                <span>🔊 Toca aquí para activar sonido</span>
              </button>
            )}

            {status === 'LOADING' && (
              <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center pointer-events-none">
                <div className="w-10 h-10 border-3 border-violet-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <span className="text-xs text-violet-300 font-bold">Cargando transmisión...</span>
              </div>
            )}

            {status === 'ERROR' && (
              <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center space-y-3 z-10">
                <p className="text-amber-400 font-bold text-sm">Señal temporalmente no disponible</p>
                <button
                  onClick={() => startPlayback()}
                  className="px-5 py-2.5 rounded-2xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-black shadow-xl"
                >
                  🔄 Reconectar Canal
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
