<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Full Premium TvGo — Plataforma OTT</title>
  <meta name="theme-color" content="#060811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(8, 12, 22, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.7); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#060811] text-slate-100 min-h-screen selection:bg-violet-600 selection:text-white antialiased overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OFFICIAL_SERVER_HOST = 'http://st.xn--aejo-gqa.de:80';

    function getOrCreateDeviceId() {
      let id = localStorage.getItem('tvgo_device_id');
      if (!id) {
        const rand = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        id = `TVGO-${rand()}-${rand()}`;
        localStorage.setItem('tvgo_device_id', id);
      }
      return id;
    }

    function srtToVtt(srtText) {
      const cleaned = srtText
        .replace(/\r+/g, '')
        .replace(/^\d+\s*\n/gm, '')
        .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
      return 'WEBVTT\n\n' + cleaned;
    }

    function parseM3uPlaylist(m3uContent) {
      const lines = m3uContent.split(/\r?\n/);
      const live = [];
      const movies = [];
      const series = [];
      const liveCats = new Set();
      const movieCats = new Set();
      const seriesCats = new Set();

      let currentMeta = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          const commaIndex = line.lastIndexOf(',');
          const title = commaIndex !== -1 ? line.slice(commaIndex + 1).trim() : 'Canal / Contenido';
          const group = groupMatch ? groupMatch[1].trim() : 'General';
          const logo = logoMatch ? logoMatch[1].trim() : '';
          currentMeta = { title, group, logo };
        } else if (!line.startsWith('#') && currentMeta) {
          const url = line;
          const lowerUrl = url.toLowerCase();
          const lowerTitle = currentMeta.title.toLowerCase();
          const lowerGroup = currentMeta.group.toLowerCase();

          const isMovieFile = lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.mkv') || lowerUrl.endsWith('.avi');
          const isSeriePattern = /s\d{1,2}[\s._-]?e\d{1,2}|temporada|capitulo|episodio/i.test(lowerTitle) || lowerGroup.includes('serie');

          if (isSeriePattern && isMovieFile) {
            seriesCats.add(currentMeta.group);
            series.push({
              type: 'MOVIE',
              id: `m3u-ser-${series.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              ext: lowerUrl.endsWith('.mkv') ? 'mkv' : 'mp4',
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          } else if (isMovieFile || lowerGroup.includes('pelicula') || lowerGroup.includes('vod') || lowerGroup.includes('cine')) {
            movieCats.add(currentMeta.group);
            movies.push({
              type: 'MOVIE',
              id: `m3u-mov-${movies.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              ext: lowerUrl.endsWith('.mkv') ? 'mkv' : 'mp4',
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          } else {
            liveCats.add(currentMeta.group);
            live.push({
              type: 'LIVE',
              id: `m3u-live-${live.length}`,
              title: currentMeta.title,
              logo: currentMeta.logo,
              categoryId: currentMeta.group,
              categoryName: currentMeta.group,
              streamUrl: url
            });
          }
          currentMeta = null;
        }
      }

      return {
        live,
        movies,
        series,
        categories: {
          LIVE: Array.from(liveCats).map(g => ({ category_id: g, category_name: g })),
          MOVIES: Array.from(movieCats).map(g => ({ category_id: g, category_name: g })),
          SERIES: Array.from(seriesCats).map(g => ({ category_id: g, category_name: g }))
        }
      };
    }

    function App() {
      const [deviceId] = useState(getOrCreateDeviceId);
      const [deviceAccess, setDeviceAccess] = useState({ allowed: true, status: 'TRIAL', daysLeft: 12 });
      const [pricing, setPricing] = useState({ priceOfficialCLP: 4000, priceExternalCLP: 6000, whatsappNumber: '+56979429123', officialEmail: 'activaciones@app.fullpremiumtvcl.com' });
      const [exchange, setExchange] = useState({ rates: { CLP: 1, PEN: 0.00395, USD: 0.00105, EUR: 0.00097, ARS: 1.05, MXN: 0.021, COP: 4.45, BRL: 0.0059 } });
      const [selectedCurrency, setSelectedCurrency] = useState('CLP');

      const [adminNotice, setAdminNotice] = useState(null);
      const [dismissedNotice, setDismissedNotice] = useState(false);

      const [showLicenseModal, setShowLicenseModal] = useState(false);
      const [showAppsModal, setShowAppsModal] = useState(false);
      const [paymentSuccessModal, setPaymentSuccessModal] = useState(false);
      const [paymentFailureModal, setPaymentFailureModal] = useState(false);
      const [deferredPwaPrompt, setDeferredPwaPrompt] = useState(null);

      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('tvgo_favorites') || '[]');
        } catch (_) {
          return [];
        }
      });

      const [loginMode, setLoginMode] = useState('OFFICIAL');
      const [activeServerHost, setActiveServerHost] = useState(OFFICIAL_SERVER_HOST);
      const [customServerUrl, setCustomServerUrl] = useState('');
      const [username, setUsername] = useState('MarcoRomero');
      const [password, setPassword] = useState('ZLK1oAddlk');
      const [m3uUrlInput, setM3uUrlInput] = useState('');
      const [m3uRawText, setM3uRawText] = useState('');

      const [auth, setAuth] = useState(false);
      const [activeTab, setActiveTab] = useState('LIVE');
      const [categories, setCategories] = useState({ LIVE: [], MOVIES: [], SERIES: [] });
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const [liveCatalog, setLiveCatalog] = useState([]);
      const [moviesCatalog, setMoviesCatalog] = useState([]);
      const [seriesCatalog, setSeriesCatalog] = useState([]);

      const [visibleLimit, setVisibleLimit] = useState(80);
      const [seriesEpisodes, setSeriesEpisodes] = useState([]);
      const [loadingSeriesInfo, setLoadingSeriesInfo] = useState(false);

      const [activeItem, setActiveItem] = useState(null);
      const [focusedIndex, setFocusedIndex] = useState(0);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');

      const syncDeviceWithServer = async (clientTypeOverride, providerLabelOverride, userOverride) => {
        try {
          const res = await fetch('/api/device/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId,
              clientType: clientTypeOverride,
              providerLabel: providerLabelOverride,
              username: userOverride
            })
          });
          const data = await res.json();
          if (data.access) setDeviceAccess(data.access);
          if (data.pricing) setPricing(data.pricing);
          if (data.exchange) setExchange(data.exchange);
          if (data.adminNotice && data.adminNotice.active && data.adminNotice.text) {
            setAdminNotice(data.adminNotice);
          } else {
            setAdminNotice(null);
          }
        } catch (_) {}
      };

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        if (status === 'success') {
          setPaymentSuccessModal(true);
        } else if (status === 'failure') {
          setPaymentFailureModal(true);
        }

        if (status) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }

        syncDeviceWithServer();

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPwaPrompt(e);
        });
      }, []);

      const toggleFavorite = (itemId, e) => {
        if (e) e.stopPropagation();
        setFavorites(prev => {
          const updated = prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId];
          localStorage.setItem('tvgo_favorites', JSON.stringify(updated));
          return updated;
        });
      };

      const fetchJsonViaProxy = async (actionUrl) => {
        const res = await fetch(`/proxy?url=${encodeURIComponent(actionUrl)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);

        try {
          const isOfficial = loginMode === 'OFFICIAL';
          const clientTier = isOfficial ? 'OFFICIAL' : 'EXTERNAL';
          const label = isOfficial ? 'Full Premium TvGo Oficial' : (loginMode === 'CUSTOM_XTREAM' ? customServerUrl : 'Lista M3U Propia');

          await syncDeviceWithServer(clientTier, label, username);

          if (loginMode === 'CUSTOM_M3U') {
            setLoadingStatus('Procesando lista M3U...');
            let content = m3uRawText;
            if (!content && m3uUrlInput.trim()) {
              const res = await fetch(`/proxy?url=${encodeURIComponent(m3uUrlInput.trim())}`);
              if (!res.ok) throw new Error('No se pudo descargar la lista M3U.');
              content = await res.text();
            }
            if (!content || !content.includes('#EXTM3U')) {
              throw new Error('Archivo o URL M3U inválido.');
            }
            const parsed = parseM3uPlaylist(content);
            setCategories(parsed.categories);
            setLiveCatalog(parsed.live);
            setMoviesCatalog(parsed.movies);
            setSeriesCatalog(parsed.series);
            if (parsed.live.length > 0) setActiveItem(parsed.live[0]);
            else if (parsed.movies.length > 0) setActiveItem(parsed.movies[0]);
            setAuth(true);
            return;
          }

          const targetHost = isOfficial ? OFFICIAL_SERVER_HOST : customServerUrl.trim().replace(/\/+$/, '');

          if (!targetHost.startsWith('http')) {
            throw new Error('La URL debe comenzar con http:// o https://');
          }

          setActiveServerHost(targetHost);
          const baseApi = `${targetHost}/player_api.php?username=${encodeURIComponent(username.trim())}&password=${encodeURIComponent(password.trim())}`;

          setLoadingStatus('1/4 Obteniendo grupos y categorías...');
          const [liveCats, vodCats, serCats] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_live_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_vod_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series_categories`).catch(() => [])
          ]);

          const liveCatMap = {};
          const vodCatMap = {};
          const serCatMap = {};

          if (Array.isArray(liveCats)) liveCats.forEach(c => { liveCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(vodCats)) vodCats.forEach(c => { vodCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(serCats)) serCats.forEach(c => { serCatMap[String(c.category_id)] = c.category_name; });

          setCategories({
            LIVE: Array.isArray(liveCats) ? liveCats : [],
            MOVIES: Array.isArray(vodCats) ? vodCats : [],
            SERIES: Array.isArray(serCats) ? serCats : []
          });

          setLoadingStatus('2/4 Cargando canales de TV en Vivo...');
          const liveData = await fetchJsonViaProxy(`${baseApi}&action=get_live_streams`);
          if (Array.isArray(liveData)) {
            const mappedLive = liveData.map((ch, idx) => {
              const catId = String(ch.category_id || '');
              return {
                type: 'LIVE',
                id: `live-${ch.stream_id || idx}`,
                streamId: ch.stream_id,
                title: ch.name || `Canal ${idx + 1}`,
                logo: ch.stream_icon || '',
                categoryId: catId,
                categoryName: liveCatMap[catId] || 'TV en Vivo',
                streamUrl: `${targetHost}/live/${username}/${password}/${ch.stream_id}.ts`
              };
            });
            setLiveCatalog(mappedLive);
            if (mappedLive.length > 0) setActiveItem(mappedLive[0]);
          }

          setLoadingStatus('3/4 Cargando catálogo de Películas...');
          const moviesData = await fetchJsonViaProxy(`${baseApi}&action=get_vod_streams`);
          if (Array.isArray(moviesData)) {
            const mappedMovies = moviesData.map((m, idx) => {
              const catId = String(m.category_id || '');
              const ext = m.container_extension || 'mp4';
              return {
                type: 'MOVIE',
                id: `movie-${m.stream_id || idx}`,
                streamId: m.stream_id,
                title: m.name || `Película ${idx + 1}`,
                logo: m.stream_icon || '',
                ext,
                categoryId: catId,
                categoryName: vodCatMap[catId] || 'Películas',
                streamUrl: `${targetHost}/movie/${username}/${password}/${m.stream_id}.${ext}`
              };
            });
            setMoviesCatalog(mappedMovies);
          }

          setLoadingStatus('4/4 Cargando catálogo de Series...');
          const seriesData = await fetchJsonViaProxy(`${baseApi}&action=get_series`);
          if (Array.isArray(seriesData)) {
            const mappedSeries = seriesData.map((s, idx) => {
              const catId = String(s.category_id || '');
              return {
                type: 'SERIE',
                id: `serie-${s.series_id || idx}`,
                seriesId: s.series_id,
                title: s.name || `Serie ${idx + 1}`,
                logo: s.cover || '',
                categoryId: catId,
                categoryName: serCatMap[catId] || 'Series',
                streamUrl: ''
              };
            });
            setSeriesCatalog(mappedSeries);
          }

          setAuth(true);
        } catch (err) {
          alert('Error de conexión: ' + err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
        }
      };

      const handleM3uFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setM3uRawText(String(ev.target?.result || ''));
        };
        reader.readAsText(file);
      };

      const handleSelectItem = async (item) => {
        if (!item) return;
        if (!deviceAccess.allowed) {
          setShowLicenseModal(true);
          return;
        }
        if (item.type === 'SERIE' && item.seriesId) {
          setLoadingSeriesInfo(true);
          setSeriesEpisodes([]);
          try {
            const infoUrl = `${activeServerHost}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series_info&series_id=${item.seriesId}`;
            const data = await fetchJsonViaProxy(infoUrl);
            const episodesObj = data?.episodes || {};
            const epList = [];
            Object.keys(episodesObj).forEach((seasonNum) => {
              const seasonArr = episodesObj[seasonNum] || [];
              seasonArr.forEach((ep) => {
                const ext = ep.container_extension || 'mp4';
                epList.push({
                  type: 'EPISODE',
                  id: `ep-${ep.id}`,
                  streamId: ep.id,
                  title: `${item.title} - T${seasonNum}:E${ep.episode_num} - ${ep.title || 'Capítulo'}`,
                  ext,
                  subtitles: ep.info?.subtitles || [],
                  categoryName: `Temporada ${seasonNum}`,
                  streamUrl: `${activeServerHost}/series/${username}/${password}/${ep.id}.${ext}`
                });
              });
            });
            setSeriesEpisodes(epList);
            if (epList.length > 0) setActiveItem(epList[0]);
          } catch (_) {
            alert('No se pudieron obtener los episodios de la serie.');
          } finally {
            setLoadingSeriesInfo(false);
          }
        } else {
          setActiveItem(item);
        }
      };

      const currentCatalog = useMemo(() => {
        if (activeTab === 'LIVE') return liveCatalog;
        if (activeTab === 'MOVIES') return moviesCatalog;
        if (activeTab === 'SERIES') return seriesCatalog;
        return [];
      }, [activeTab, liveCatalog, moviesCatalog, seriesCatalog]);

      const currentCategories = useMemo(() => categories[activeTab] || [], [categories, activeTab]);

      // CALCULAR FAVORITOS EXCLUSIVOS DEL CATÁLOGO ACTUAL (EN VIVO, CINE O SERIES)
      const currentTabFavorites = useMemo(() => {
        return currentCatalog.filter(item => favorites.includes(item.id));
      }, [currentCatalog, favorites]);

      const filteredItems = useMemo(() => {
        let list = currentCatalog;
        if (selectedCategory === 'FAVORITES') {
          list = currentTabFavorites;
        } else if (selectedCategory !== 'ALL') {
          list = list.filter(item => String(item.categoryId) === String(selectedCategory));
        }
        const q = search.trim().toLowerCase();
        if (q) {
          list = list.filter(item => item.title.toLowerCase().includes(q));
        }
        return list;
      }, [currentCatalog, currentTabFavorites, selectedCategory, search]);

      const visibleItems = useMemo(() => filteredItems.slice(0, visibleLimit), [filteredItems, visibleLimit]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (showLicenseModal || showAppsModal || paymentSuccessModal || paymentFailureModal) return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setFocusedIndex(prev => {
              const next = Math.min(prev + 1, visibleItems.length - 1);
              const el = document.getElementById(`item-${next}`);
              if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              return next;
            });
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setFocusedIndex(prev => {
              const next = Math.max(prev - 1, 0);
              const el = document.getElementById(`item-${next}`);
              if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              return next;
            });
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (visibleItems[focusedIndex]) {
              handleSelectItem(visibleItems[focusedIndex]);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [visibleItems, focusedIndex, showLicenseModal, showAppsModal, paymentSuccessModal, paymentFailureModal]);

      const handleTabChange = (newTab) => {
        setActiveTab(newTab);
        setSelectedCategory('ALL');
        setSearch('');
        setVisibleLimit(80);
        setFocusedIndex(0);
        setSeriesEpisodes([]);
        const targetList = newTab === 'LIVE' ? liveCatalog : newTab === 'MOVIES' ? moviesCatalog : seriesCatalog;
        if (targetList.length > 0 && newTab !== 'SERIES') {
          setActiveItem(targetList[0]);
        } else if (newTab === 'SERIES') {
          setActiveItem(null);
        }
      };

      const formatConvertedPrice = (clpAmount) => {
        const rate = exchange?.rates?.[selectedCurrency] || 1;
        const converted = clpAmount * rate;
        if (selectedCurrency === 'CLP' || selectedCurrency === 'ARS' || selectedCurrency === 'COP') {
          return `${Math.round(converted).toLocaleString('es-CL')} ${selectedCurrency}`;
        }
        return `${converted.toFixed(2)} ${selectedCurrency}`;
      };

      const isOfficialClient = loginMode === 'OFFICIAL';
      const applicableClpPrice = isOfficialClient ? pricing.priceOfficialCLP : pricing.priceExternalCLP;

      const heroItem = useMemo(() => {
        if (activeTab === 'MOVIES' && moviesCatalog.length > 0) return moviesCatalog[0];
        if (activeTab === 'SERIES' && seriesCatalog.length > 0) return seriesCatalog[0];
        return null;
      }, [activeTab, moviesCatalog, seriesCatalog]);

      return (
        <div className="min-h-screen flex flex-col bg-[#060811]">
          {/* HEADER OTT FLOTANTE */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-[#080B16]/90 border-b border-slate-800/80 px-4 lg:px-7 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-purple-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-violet-600/30 ring-1 ring-white/20">
                TV
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black tracking-tight text-white">Full Premium <span className="bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">TvGo</span></span>
                  <span className="px-2 py-0.5 text-[9px] font-extrabold uppercase tracking-wider bg-violet-500/10 text-violet-300 border border-violet-500/20 rounded-full">
                    Studio
                  </span>
                </div>
                <div className="text-[11px] text-slate-400 flex items-center gap-1.5 font-medium">
                  Dispositivo: <span className="font-mono text-slate-200">{deviceId}</span>
                </div>
              </div>
            </div>

            {auth && (
              <nav className="flex items-center bg-slate-900/90 p-1 rounded-2xl border border-slate-800 shadow-xl gap-1">
                <button
                  onClick={() => handleTabChange('LIVE')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${
                    activeTab === 'LIVE'
                      ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg shadow-violet-600/30 ring-1 ring-violet-400/40'
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <span>📺</span> En Vivo <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-black/40 font-mono">{liveCatalog.length}</span>
                </button>
                <button
                  onClick={() => handleTabChange('MOVIES')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${
                    activeTab === 'MOVIES'
                      ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg shadow-violet-600/30 ring-1 ring-violet-400/40'
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <span>🍿</span> Cine <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-black/40 font-mono">{moviesCatalog.length}</span>
                </button>
                <button
                  onClick={() => handleTabChange('SERIES')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${
                    activeTab === 'SERIES'

    function VideoPlayer({ item, username, password, serverHost }) {
      const videoRef = useRef(null);
      const playerRef = useRef(null);

      const [status, setStatus] = useState('IDLE');
      const [isMutedByPolicy, setIsMutedByPolicy] = useState(false);
      const [audioTracks, setAudioTracks] = useState([
        { index: 0, label: 'Pista 1 — Principal' },
        { index: 1, label: 'Pista 2 — Secundario' }
      ]);
      const [selectedAudioTrack, setSelectedAudioTrack] = useState(0);
      const [subtitleTracks, setSubtitleTracks] = useState([]);
      const [activeSubtitle, setActiveSubtitle] = useState('OFF');

      useEffect(() => {
        setSelectedAudioTrack(0);
        setSubtitleTracks([]);
        setActiveSubtitle('OFF');
        setIsMutedByPolicy(false);

        if (item?.type === 'MOVIE' && item?.streamId && serverHost) {
          const vodInfoUrl = `${serverHost}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_vod_info&vod_id=${item.streamId}`;
          fetch(`/proxy?url=${encodeURIComponent(vodInfoUrl)}`)
            .then(r => r.json())
            .then(data => {
              const subs = data?.info?.subtitles || [];
              if (Array.isArray(subs) && subs.length > 0) {
                setSubtitleTracks(subs.map((s, idx) => ({
                  id: `sub-${idx}`,
                  label: s.language || s.name || `Subtítulo ${idx + 1}`,
                  url: `/proxy?url=${encodeURIComponent(s.url || s.file)}`
                })));
              }
            })
            .catch(() => {});
        }
      }, [item]);

      const executePlaySafe = async (videoElement, playerInstance) => {
        try {
          videoElement.muted = false;
          videoElement.volume = 1.0;
          if (playerInstance) await playerInstance.play();
          else await videoElement.play();
          setIsMutedByPolicy(false);
          setStatus('PLAYING');
        } catch (err) {
          videoElement.muted = true;
          setIsMutedByPolicy(true);
          try {
            if (playerInstance) await playerInstance.play();
            else await videoElement.play();
            setStatus('PLAYING');
          } catch (_) {
            setStatus('PLAYING');
          }
        }
      };

      const startPlayback = () => {
        if (!item?.streamUrl || !videoRef.current) return;
        setStatus('LOADING');
        const video = videoRef.current;

        if (playerRef.current) {
          try { playerRef.current.destroy(); } catch (_) {}
          playerRef.current = null;
        }

        const directProxyUrl = `${window.location.origin}/proxy?url=${encodeURIComponent(item.streamUrl)}`;

        if (item.type === 'LIVE') {
          if (window.mpegts && window.mpegts.isSupported()) {
            try {
              const player = window.mpegts.createPlayer({
                type: 'm2ts',
                isLive: true,
                url: directProxyUrl,
                cors: true
              }, {
                enableWorker: true,
                lazyLoad: false,
                enableStashBuffer: false,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true,
                autoCleanupMaxBackwardDuration: 25,
                autoCleanupMinBackwardDuration: 10
              });

              playerRef.current = player;
              player.attachMediaElement(video);
              player.load();

              executePlaySafe(video, player);

              player.on(window.mpegts.Events.ERROR, () => {
                if (video.currentTime > 0) return;
                setStatus('ERROR');
              });
            } catch (_) {
              setStatus('ERROR');
            }
          } else {
            video.src = directProxyUrl;
            video.load();
            executePlaySafe(video, null);
          }
        } else {
          video.src = directProxyUrl;
          video.load();
          executePlaySafe(video, null).then(() => {
            if (video.audioTracks && video.audioTracks.length > 1) {
              const detected = [];
              for (let i = 0; i < video.audioTracks.length; i++) {
                const t = video.audioTracks[i];
                detected.push({ index: i, label: `Pista ${i + 1} — ${t.label || t.language || (i === 0 ? 'Español' : 'Inglés')}` });
              }
              setAudioTracks(detected);
            }
          }).catch(() => setStatus('ERROR'));
        }
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleTimeUpdate = () => {
          if (video.currentTime > 0 && status === 'LOADING') setStatus('PLAYING');
        };

        const handleCanPlay = () => {
          if (video.paused) video.play().catch(() => {});
          if (video.buffered && video.buffered.length > 0) {
            const bStart = video.buffered.start(0);
            if (video.currentTime < bStart) video.currentTime = bStart + 0.05;
          }
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('playing', () => setStatus('PLAYING'));
        video.addEventListener('canplay', handleCanPlay);

        return () => {
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('canplay', handleCanPlay);
        };
      }, [status]);

      useEffect(() => {
        startPlayback();
        return () => {
          if (playerRef.current) {
            try { playerRef.current.destroy(); } catch (_) {}
            playerRef.current = null;
          }
        };
      }, [item, selectedAudioTrack]);

      const handleUnmuteClick = () => {
        if (videoRef.current) {
          videoRef.current.muted = false;
          videoRef.current.volume = 1.0;
          videoRef.current.play().catch(() => {});
          setIsMutedByPolicy(false);
        }
      };

      const handleAudioChange = (newIndex) => {
        const idx = Number(newIndex);
        setSelectedAudioTrack(idx);
        const video = videoRef.current;
        if (video?.audioTracks && video.audioTracks.length > 1) {
          for (let i = 0; i < video.audioTracks.length; i++) {
            video.audioTracks[i].enabled = (i === idx);
          }
        }
      };

      const handleSubtitleChange = (subId) => {
        setActiveSubtitle(subId);
        const video = videoRef.current;
        if (!video?.textTracks) return;
        for (let i = 0; i < video.textTracks.length; i++) {
          const track = video.textTracks[i];
          track.mode = (subId !== 'OFF' && track.label === subId) ? 'showing' : 'disabled';
        }
      };

      return (
        <div className="bg-black rounded-3xl overflow-hidden shadow-2xl relative border border-slate-800/90 w-full flex flex-col justify-center">
          <div className="relative aspect-video bg-black flex items-center justify-center">
            <video
              ref={videoRef}
              controls
              playsInline
              autoPlay
              crossOrigin="anonymous"
              className="w-full h-full object-contain cursor-pointer"
              onClick={handleUnmuteClick}
            >
              {subtitleTracks.map(sub => (
                <track key={sub.id} kind="subtitles" label={sub.label} src={sub.url} default={activeSubtitle === sub.label} />
              ))}
            </video>

            {isMutedByPolicy && (
              <div
                onClick={handleUnmuteClick}
                className="absolute top-4 right-4 z-20 px-3.5 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs shadow-2xl cursor-pointer hover:bg-amber-400 transition flex items-center gap-1.5 animate-bounce"
              >
                <span>🔊 Activar Audio</span>
              </div>
            )}

            {status === 'LOADING' && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center pointer-events-none">
                <div className="w-10 h-10 border-3 border-violet-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <span className="text-xs text-violet-300 font-bold tracking-wide">Sintonizando transmisión...</span>
              </div>
            )}

            {status === 'ERROR' && (
              <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center space-y-3 z-10">
                <p className="text-amber-400 font-bold text-sm">Señal temporalmente no disponible</p>
                <button
                  onClick={() => startPlayback()}
                  className="px-5 py-2.5 rounded-2xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-black shadow-xl"
                >
                  🔄 Reconectar Canal
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
