<body class="bg-[#060811] text-slate-100 min-h-screen selection:bg-violet-600 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OFFICIAL_SERVER_HOST = 'http://st.xn--aejo-gqa.de:80';

    function getOrCreateDeviceId() {
      let id = '';
      try {
        id = localStorage.getItem('tvgo_device_id') || '';
      } catch (_) {}
      if (!/^TVGO-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(id)) {
        const rand = () => Math.random().toString(36).substring(2, 6).toUpperCase().padEnd(4, 'X');
        id = `TVGO-${rand()}-${rand()}`;
        try {
          localStorage.setItem('tvgo_device_id', id);
        } catch (_) {}
      }
      return id;
    }

    function getZoneFocusables(zoneName) {
      const zone = document.querySelector(`[data-zone="${zoneName}"]`);
      if (!zone) return [];
      const selector = 'button:not(:disabled):not([tabindex="-1"]), a[href]:not([tabindex="-1"]), input:not(:disabled):not([tabindex="-1"]), [tabindex="0"]';
      return Array.from(zone.querySelectorAll(selector)).filter((el) => {
        if (el.offsetParent === null) return false;
        const rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
    }

    function focusElementSmooth(el) {
      if (!el) return false;
      el.focus();
      try {
        el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      } catch (_) {}
      return true;
    }

    function moveDpadFocus(direction) {
      const active = document.activeElement;
      const currentZoneEl = active && active.closest ? active.closest('[data-zone]') : null;
      const currentZone = currentZoneEl ? currentZoneEl.getAttribute('data-zone') : null;

      // Navegación inteligente por columnas en TV (Categorías <-> Canales <-> Reproductor <-> Header)
      if (currentZone === 'categories' || currentZone === 'channels') {
        const list = getZoneFocusables(currentZone);
        const idx = list.indexOf(active);

        if (direction === 38) { // Arriba
          if (idx > 0) return focusElementSmooth(list[idx - 1]);
          const headerItems = getZoneFocusables('header');
          if (headerItems.length > 0) return focusElementSmooth(headerItems[0]);
          return false;
        }
        if (direction === 40) { // Abajo
          if (idx >= 0 && idx < list.length - 1) return focusElementSmooth(list[idx + 1]);
          return false;
        }
        if (direction === 39) { // Derecha
          if (currentZone === 'categories') {
            const targetZone = document.querySelector('[data-zone="channels"]') ? 'channels' : 'catalog';
            const targetList = getZoneFocusables(targetZone);
            const activeTarget = targetList.find(el => el.getAttribute('data-active') === 'true') || targetList.find(el => el.tagName !== 'INPUT') || targetList[0];
            if (activeTarget) return focusElementSmooth(activeTarget);
          } else if (currentZone === 'channels') {
            const playerList = getZoneFocusables('player');
            if (playerList.length > 0) return focusElementSmooth(playerList[0]);
          }
          return false;
        }
        if (direction === 37) { // Izquierda
          if (currentZone === 'channels') {
            const catList = getZoneFocusables('categories');
            const activeCat = catList.find(el => el.getAttribute('data-active') === 'true') || catList.find(el => el.tagName !== 'INPUT') || catList[0];
            if (activeCat) return focusElementSmooth(activeCat);
          }
          return false;
        }
      }

      if (currentZone === 'player') {
        const playerList = getZoneFocusables('player');
        const idx = playerList.indexOf(active);
        if (direction === 37) { // Izquierda -> volver a canales
          if (idx > 0) return focusElementSmooth(playerList[idx - 1]);
          const chList = getZoneFocusables('channels');
          const activeCh = chList.find(el => el.getAttribute('data-active') === 'true') || chList.find(el => el.tagName !== 'INPUT') || chList[0];
          if (activeCh) return focusElementSmooth(activeCh);
          return false;
        }
        if (direction === 39 && idx >= 0 && idx < playerList.length - 1) {
          return focusElementSmooth(playerList[idx + 1]);
        }
        if (direction === 38) {
          const headerItems = getZoneFocusables('header');
          if (headerItems.length > 0) return focusElementSmooth(headerItems[0]);
        }
      }

      if (currentZone === 'header') {
        const headerList = getZoneFocusables('header');
        const idx = headerList.indexOf(active);
        if (direction === 37 && idx > 0) return focusElementSmooth(headerList[idx - 1]);
        if (direction === 39 && idx >= 0 && idx < headerList.length - 1) return focusElementSmooth(headerList[idx + 1]);
        if (direction === 40) {
          const catList = getZoneFocusables('categories');
          const target = catList.find(el => el.getAttribute('data-active') === 'true') || catList.find(el => el.tagName !== 'INPUT') || catList[0];
          if (target) return focusElementSmooth(target);
        }
      }

      const selector = 'button:not(:disabled):not([tabindex="-1"]), a[href]:not([tabindex="-1"]), input:not(:disabled):not([tabindex="-1"]), [tabindex="0"]';
      const candidates = Array.from(document.querySelectorAll(selector)).filter((el) => {
        if (el.offsetParent === null) return false;
        const rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
      if (candidates.length === 0) return false;

      if (!active || active === document.body || !candidates.includes(active)) {
        return focusElementSmooth(candidates[0]);
      }

      const cur = active.getBoundingClientRect();
      const cx = cur.left + cur.width / 2;
      const cy = cur.top + cur.height / 2;

      let best = null;
      let bestScore = Infinity;

      for (const el of candidates) {
        if (el === active) continue;
        const r = el.getBoundingClientRect();
        const ex = r.left + r.width / 2;
        const ey = r.top + r.height / 2;
        const dx = ex - cx;
        const dy = ey - cy;

        let valid = false;
        let primary = 0;
        let secondary = 0;

        if (direction === 37 && dx < -4) { valid = true; primary = -dx; secondary = Math.abs(dy); }
        else if (direction === 39 && dx > 4) { valid = true; primary = dx; secondary = Math.abs(dy); }
        else if (direction === 38 && dy < -4) { valid = true; primary = -dy; secondary = Math.abs(dx); }
        else if (direction === 40 && dy > 4) { valid = true; primary = dy; secondary = Math.abs(dx); }

        if (!valid) continue;
        const score = primary + secondary * 2.2;
        if (score < bestScore) {
          bestScore = score;
          best = el;
        }
      }

      if (best) {
        return focusElementSmooth(best);
      }
      return false;
    }

    function extractXtreamFromUrl(rawUrl) {
      if (!rawUrl) return null;
      try {
        const uMatch = rawUrl.match(/[?&]username=([^&]+)/i);
        const pMatch = rawUrl.match(/[?&]password=([^&]+)/i);
        const hostMatch = rawUrl.match(/^(https?:\/\/[^\/?#]+)/i);
        if (uMatch && pMatch && hostMatch) {
          return {
            host: hostMatch[1],
            username: decodeURIComponent(uMatch[1]),
            password: decodeURIComponent(pMatch[1])
          };
        }
      } catch (_) {}
      return null;
    }

    function detectTvPlatform() {
      try {
        if (window.AndroidTvBridge) return 'ANDROID_TV';
        if (typeof window.tizen !== 'undefined') return 'SAMSUNG_TIZEN';
        if (typeof window.webOS !== 'undefined') return 'LG_WEBOS';
        const ua = navigator.userAgent || '';
        if (/Tizen/i.test(ua)) return 'SAMSUNG_TIZEN';
        if (/Web0S|webOS/i.test(ua)) return 'LG_WEBOS';
        if (/Android TV|GoogleTV|AFT[A-Z0-9]+|SmartTV|BRAVIA/i.test(ua)) return 'ANDROID_TV';
      } catch (_) {}
      return 'WEB';
    }

    function registerTizenRemoteKeys() {
      try {
        if (window.tizen && window.tizen.tvinputdevice && typeof window.tizen.tvinputdevice.registerKey === 'function') {
          const keys = [
            'MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop',
            'MediaRewind', 'MediaFastForward', 'ChannelUp', 'ChannelDown',
            'ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue'
          ];
          keys.forEach((k) => {
            try { window.tizen.tvinputdevice.registerKey(k); } catch (_) {}
          });
        }
      } catch (_) {}
    }

    function exitTvApp() {
      try {
        if (window.AndroidTvBridge && typeof window.AndroidTvBridge.exitApp === 'function') {
          window.AndroidTvBridge.exitApp();
          return true;
        }
      } catch (_) {}
      try {
        if (window.tizen && window.tizen.application && typeof window.tizen.application.getCurrentApplication === 'function') {
          window.tizen.application.getCurrentApplication().exit();
          return true;
        }
      } catch (_) {}
      try {
        if (window.webOS && typeof window.webOS.platformBack === 'function') {
          window.webOS.platformBack();
          return true;
        }
      } catch (_) {}
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'TVGO_EXIT_APP' }, '*');
          return true;
        }
      } catch (_) {}
      try {
        const platform = detectTvPlatform();
        if (platform === 'LG_WEBOS' || platform === 'SAMSUNG_TIZEN') {
          window.close();
          return true;
        }
      } catch (_) {}
      return false;
    }

    function App() {
      const [tvPlatform] = useState(detectTvPlatform);
      const isSmartTv = tvPlatform !== 'WEB';
      const [deviceId] = useState(getOrCreateDeviceId);
      const [devicePin, setDevicePin] = useState(() => localStorage.getItem('tvgo_device_pin') || '----');
      const [deviceAccess, setDeviceAccess] = useState({ allowed: true, status: 'TRIAL', daysLeft: 12 });

      const [adminNotice, setAdminNotice] = useState(null);
      const [dismissedNotice, setDismissedNotice] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('tvgo_favorites') || '[]');
        } catch (_) {
          return [];
        }
      });

      const [activeServerHost, setActiveServerHost] = useState(OFFICIAL_SERVER_HOST);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');

      const [auth, setAuth] = useState(false);
      const [activeTab, setActiveTab] = useState('LIVE');
      const [categories, setCategories] = useState({ LIVE: [], MOVIES: [], SERIES: [] });
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const [liveCatalog, setLiveCatalog] = useState([]);
      const [moviesCatalog, setMoviesCatalog] = useState([]);
      const [seriesCatalog, setSeriesCatalog] = useState([]);

      const [visibleLimit, setVisibleLimit] = useState(120);
      const [seriesEpisodes, setSeriesEpisodes] = useState([]);
      const [selectedSerieInfo, setSelectedSerieInfo] = useState(null);
      const [selectedSeason, setSelectedSeason] = useState('1');
      const [seriesLoading, setSeriesLoading] = useState(false);

      const [activeItem, setActiveItem] = useState(null);
      const [focusedIndex, setFocusedIndex] = useState(0);
      const [search, setSearch] = useState('');
      const [catSearch, setCatSearch] = useState('');
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [clockText, setClockText] = useState(() => {
        const d = new Date();
        return {
          time: d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }),
          date: d.toLocaleDateString('es-CL', { month: 'long', day: 'numeric', year: 'numeric' })
        };
      });

      useEffect(() => {
        const tick = setInterval(() => {
          const d = new Date();
          setClockText({
            time: d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }),
            date: d.toLocaleDateString('es-CL', { month: 'long', day: 'numeric', year: 'numeric' })
          });
        }, 30000);
        return () => clearInterval(tick);
      }, []);

      const triggerVideoFullscreen = () => {
        const activeVideo = document.querySelector('video');
        if (!activeVideo) return;
        const container = activeVideo.parentElement || activeVideo;
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else if (container.requestFullscreen) {
          container.requestFullscreen().catch(() => {});
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      };

      const fetchJsonViaProxy = async (actionUrl) => {
        const res = await fetch(`/proxy?url=${encodeURIComponent(actionUrl)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      };

      const connectWithPlaylist = async (pl) => {
        setLoading(true);
        try {
          let targetType = pl.type;
          let targetHost = pl.host;
          let targetUser = pl.username;
          let targetPass = pl.password;

          if (targetType === 'M3U' && pl.m3uUrl) {
            const detected = extractXtreamFromUrl(pl.m3uUrl);
            if (detected) {
              targetType = 'XTREAM';
              targetHost = detected.host;
              targetUser = detected.username;
              targetPass = detected.password;
            }
          }

          const finalHost = (targetHost || OFFICIAL_SERVER_HOST).trim().replace(/\/+$/, '');
          setActiveServerHost(finalHost);
          setUsername(targetUser);
          setPassword(targetPass);

          const baseApi = `${finalHost}/player_api.php?username=${encodeURIComponent(targetUser)}&password=${encodeURIComponent(targetPass)}`;

          setLoadingStatus('Cargando categorías...');
          const [liveCats, vodCats, serCats] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_live_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_vod_categories`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series_categories`).catch(() => [])
          ]);

          const liveCatMap = {};
          const vodCatMap = {};
          const serCatMap = {};

          if (Array.isArray(liveCats)) liveCats.forEach(c => { liveCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(vodCats)) vodCats.forEach(c => { vodCatMap[String(c.category_id)] = c.category_name; });
          if (Array.isArray(serCats)) serCats.forEach(c => { serCatMap[String(c.category_id)] = c.category_name; });

          setCategories({
            LIVE: Array.isArray(liveCats) ? liveCats : [],
            MOVIES: Array.isArray(vodCats) ? vodCats : [],
            SERIES: Array.isArray(serCats) ? serCats : []
          });

          setLoadingStatus('Cargando canales en vivo...');
          const liveData = await fetchJsonViaProxy(`${baseApi}&action=get_live_streams`);
          if (Array.isArray(liveData)) {
            const mappedLive = liveData.map((ch, idx) => ({
              type: 'LIVE',
              id: `live-${ch.stream_id || idx}`,
              streamId: ch.stream_id,
              title: ch.name || `Canal ${idx + 1}`,
              logo: ch.stream_icon || '',
              categoryId: String(ch.category_id || ''),
              categoryName: liveCatMap[String(ch.category_id || '')] || 'TV en Vivo',
              streamUrl: `${finalHost}/live/${targetUser}/${targetPass}/${ch.stream_id}.ts`,
              hlsUrl: `${finalHost}/live/${targetUser}/${targetPass}/${ch.stream_id}.m3u8`
            }));
            setLiveCatalog(mappedLive);
          }

          setLoadingStatus('Cargando catálogo de Cine y Series...');
          const [moviesData, seriesData] = await Promise.all([
            fetchJsonViaProxy(`${baseApi}&action=get_vod_streams`).catch(() => []),
            fetchJsonViaProxy(`${baseApi}&action=get_series`).catch(() => [])
          ]);

          if (Array.isArray(moviesData)) {
            const normMovieKey = (t) => (t || '').replace(/\(\s*4k\s*\)|\(\s*uhd\s*\)|\(\s*2160p\s*\)|\b4k\b/gi, '').replace(/\s+/g, ' ').trim().toLowerCase();
            const fhdByTitle = {};
            moviesData.forEach((m) => {
              const name = m.name || '';
              const catName = vodCatMap[String(m.category_id || '')] || '';
              const is4k = /4k|2160p|uhd/i.test(name) || /4k/i.test(catName);
              if (!is4k && m.stream_id) {
                const ext = (m.container_extension || 'mp4').toLowerCase();
                const key = normMovieKey(name);
                if (key && !fhdByTitle[key]) {
                  fhdByTitle[key] = `${finalHost}/movie/${targetUser}/${targetPass}/${m.stream_id}.${ext}`;
                }
              }
            });

            setMoviesCatalog(moviesData.map((m, idx) => {
              const ext = (m.container_extension || 'mp4').toLowerCase();
              const name = m.name || `Película ${idx + 1}`;
              const catName = vodCatMap[String(m.category_id || '')] || 'Películas';
              const is4k = /4k|2160p|uhd/i.test(name) || /4k/i.test(catName);
              const primaryUrl = `${finalHost}/movie/${targetUser}/${targetPass}/${m.stream_id}.${ext}`;
              const fhdCounterpart = is4k ? (fhdByTitle[normMovieKey(name)] || null) : null;
              return {
                type: 'MOVIE',
                id: `movie-${m.stream_id || idx}`,
                streamId: m.stream_id,
                title: name,
                logo: m.stream_icon || '',
                ext,
                categoryId: String(m.category_id || ''),
                categoryName: catName,
                streamUrl: primaryUrl,
                fhdStreamUrl: (fhdCounterpart && fhdCounterpart !== primaryUrl) ? fhdCounterpart : null
              };
            }));
          }

          if (Array.isArray(seriesData)) {
            setSeriesCatalog(seriesData.map((s, idx) => ({
              type: 'SERIE',
              id: `serie-${s.series_id || idx}`,
              seriesId: s.series_id,
              title: s.name || `Serie ${idx + 1}`,
              logo: s.cover || '',
              categoryId: String(s.category_id || ''),
              categoryName: serCatMap[String(s.category_id || '')] || 'Series'
            })));
          }

          setAuth(true);
          try {
            if (pl && typeof pl === 'object') {
              localStorage.setItem('tvgo_saved_playlist', JSON.stringify(pl));
            }
          } catch (_) {}
        } catch (err) {
          alert('Error al conectar con la lista: ' + err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
        }
      };

      const authRef = useRef(auth);
      useEffect(() => { authRef.current = auth; }, [auth]);

      const getSavedPlaylistLocal = () => {
        try {
          const raw = localStorage.getItem('tvgo_saved_playlist');
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object' && (parsed.m3uUrl || (parsed.host && parsed.username && parsed.password))) {
            return parsed;
          }
        } catch (_) {}
        return null;
      };

      const syncWithServer = async (autoConnect = true) => {
        const savedPlaylist = getSavedPlaylistLocal();
        const savedPin = (() => {
          try { return localStorage.getItem('tvgo_device_pin') || ''; } catch (_) { return ''; }
        })();

        try {
          const res = await fetch('/api/device/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deviceId,
              ...(savedPin && /^\d{4}$/.test(savedPin) ? { savedPin } : {}),
              ...(savedPlaylist ? { savedPlaylist } : {})
            })
          });
          const data = await res.json();
          if (data.devicePin) {
            setDevicePin(data.devicePin);
            localStorage.setItem('tvgo_device_pin', data.devicePin);
          }
          if (data.access) {
            setDeviceAccess(data.access);
            if (!data.access.allowed) {
              setActiveItem(null);
              setAuth(false);
            }
          }

          if (data.adminNotice?.active && data.adminNotice?.text) {
            setAdminNotice(data.adminNotice);
            setDismissedNotice(false);
          } else {
            setAdminNotice(null);
          }

          if (data.playlist) {
            try {
              localStorage.setItem('tvgo_saved_playlist', JSON.stringify(data.playlist));
            } catch (_) {}
          } else if (data.playlistCleared) {
            try {
              localStorage.removeItem('tvgo_saved_playlist');
            } catch (_) {}
          }

          const effectivePlaylist = data.playlist || (!data.playlistCleared ? savedPlaylist : null);
          if (effectivePlaylist && data.access?.allowed !== false && autoConnect && !authRef.current) {
            connectWithPlaylist(effectivePlaylist);
          }
        } catch (_) {
          // Si el servidor está reiniciando durante un despliegue, mantener la lista ya cargada localmente
          if (savedPlaylist && autoConnect && !authRef.current) {
            connectWithPlaylist(savedPlaylist);
          }
        }
      };

      useEffect(() => {
        // Limpiar Service Workers y caché antigua del WebView al iniciar
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((r) => r.unregister());
            }).catch(() => {});
          }
          if (window.caches && typeof window.caches.keys === 'function') {
            window.caches.keys().then((keys) => {
              keys.forEach((k) => window.caches.delete(k));
            }).catch(() => {});
          }
        } catch (_) {}

        registerTizenRemoteKeys();
        syncWithServer(true);
        // Polling cada 10 segundos: si aún no entra, conecta automáticamente apenas se cargue la lista desde el portal
        const interval = setInterval(() => {
          syncWithServer(!authRef.current);
        }, 10000);
        return () => clearInterval(interval);
      }, []);

      const filteredItemsRef = useRef([]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          const keyCode = e.keyCode || e.which;
          const activeEl = document.activeElement;
          const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');

          const isBackKey = (
            keyCode === 4 ||
            keyCode === 461 ||
            keyCode === 10009 ||
            keyCode === 27 ||
            (keyCode === 8 && !isInput) ||
            e.key === 'Escape' ||
            e.key === 'GoBack' ||
            e.key === 'BrowserBack'
          );

          if (isBackKey) {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              e.preventDefault();
              if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
              else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
              return;
            }
            if (adminNotice && !dismissedNotice) {
              e.preventDefault();
              setDismissedNotice(true);
              return;
            }
            if (activeItem) {
              e.preventDefault();
              setActiveItem(null);
              return;
            }
            if (selectedSerieInfo) {
              e.preventDefault();
              setSelectedSerieInfo(null);
              setSeriesEpisodes([]);
              return;
            }
            if (auth && activeTab !== 'LIVE') {
              e.preventDefault();
              handleTabChange('LIVE');
              return;
            }
            if (exitTvApp()) {
              e.preventDefault();
            }
            return;
          }

          // Teclas multimedia Smart TV (Samsung Tizen, LG webOS, Google TV)
          const activeVideo = document.querySelector('video');
          if (activeVideo && !isInput) {
            if (keyCode === 415 || e.key === 'MediaPlay') {
              e.preventDefault();
              activeVideo.play().catch(() => {});
              return;
            }
            if (keyCode === 19 || e.key === 'MediaPause') {
              e.preventDefault();
              activeVideo.pause();
              return;
            }
            if (keyCode === 179 || keyCode === 10252 || e.key === 'MediaPlayPause') {
              e.preventDefault();
              if (activeVideo.paused) activeVideo.play().catch(() => {});
              else activeVideo.pause();
              return;
            }
            if (keyCode === 413 || e.key === 'MediaStop') {
              e.preventDefault();
              setActiveItem(null);
              return;
            }
            if (keyCode === 406 || e.key === 'f' || e.key === 'F') {
              e.preventDefault();
              const container = activeVideo.parentElement || activeVideo;
              if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
              } else if (container.requestFullscreen) {
                container.requestFullscreen().catch(() => {});
              } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
              }
              return;
            }
          }

          // Cambio rápido de canal (Channel Up / Down o PageUp / PageDown) en TV en Vivo
          if (auth && activeTab === 'LIVE' && !isInput && (keyCode === 427 || keyCode === 428 || keyCode === 33 || keyCode === 34)) {
            const list = filteredItemsRef.current || [];
            if (list.length > 0) {
              e.preventDefault();
              const curIdx = activeItem ? list.findIndex((it) => it.id === activeItem.id) : -1;
              const isNext = (keyCode === 427 || keyCode === 33);
              const nextIdx = curIdx < 0 ? 0 : (isNext ? (curIdx + 1) % list.length : (curIdx - 1 + list.length) % list.length);
              setActiveItem(list[nextIdx]);
              return;
            }
          }

          if (keyCode >= 37 && keyCode <= 40) {
            if (isInput && (keyCode === 37 || keyCode === 39)) return;
            e.preventDefault();
            moveDpadFocus(keyCode);
            return;
          }

          if (keyCode === 13 && activeEl && !isInput) {
            if (activeEl.tagName === 'DIV' || activeEl.getAttribute('tabindex') === '0') {
              e.preventDefault();
              activeEl.click();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [adminNotice, dismissedNotice, activeItem, selectedSerieInfo, auth, activeTab]);

            let data = null;

            } catch (_) {
              data = await fetchJsonViaProxy(infoUrl);
            }
            const episodesObj = data?.episodes || {};
            const epList = [];
            const seasonKeys = Object.keys(episodesObj).sort((a, b) => Number(a) - Number(b));
            seasonKeys.forEach((seasonNum) => {

    // REPRODUCTOR UNIVERSAL SMART TV (LIVE TS + LIVE FFMPEG H264 FALLBACK + VOD NATIVO + CAMBIO DE AUDIO MATROSKA)
    const BLACK_POSTER = 'data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs=';

    function VideoPlayer({ item, isLiveMode, deviceId }) {
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const hlsRef = useRef(null);
      const fallbackTimerRef = useRef(null);
      const probedItemIdRef = useRef(null);
      const minRequiredModeRef = useRef('DIRECT');

      const [status, setStatus] = useState('IDLE');
      const [needsUnmute, setNeedsUnmute] = useState(false);
      const [audioTracks, setAudioTracks] = useState([]);
      const [selectedAudioTrack, setSelectedAudioTrack] = useState(0);
      const [useFhdCompat, setUseFhdCompat] = useState(true);
      // vodMode: 'DIRECT' (proxy nativo con Range) | 'REMUX' (FFmpeg -c:v copy -c:a aac -sn -f matroska) | 'TRANSCODE' (FFmpeg 720p H264 + AAC para evitar pantalla partida en 4K/10-bit)
      const [vodMode, setVodMode] = useState('DIRECT');
      // liveModeType: 'DIRECT_TS' (mpegts.js directo) | 'FFMPEG_TS' (FFmpeg H264+AAC MPEG-TS para canales MPEG2/MP2/AC3 como Mega SD)
      const [liveModeType, setLiveModeType] = useState('DIRECT_TS');

      const activeStreamUrl = useMemo(() => {
        if (!item?.streamUrl) return '';
        if (useFhdCompat && item.fhdStreamUrl) return item.fhdStreamUrl;
        return item.streamUrl;
      }, [item, useFhdCompat]);

      const cleanup = () => {
        if (fallbackTimerRef.current) {
          clearTimeout(fallbackTimerRef.current);
          fallbackTimerRef.current = null;
        }
        if (hlsRef.current) {
          try {
            hlsRef.current.stopLoad();
            hlsRef.current.detachMedia();
            hlsRef.current.destroy();
          } catch (_) {}
          hlsRef.current = null;
        }
        if (playerRef.current) {
          try {
            playerRef.current.pause();
            playerRef.current.unload();
            playerRef.current.detachMediaElement();
            playerRef.current.destroy();
          } catch (_) {}
          playerRef.current = null;
        }
        if (videoRef.current) {
          try {
            videoRef.current.pause();
            videoRef.current.removeAttribute('src');
            videoRef.current.load();
          } catch (_) {}
        }
      };

      const attemptPlay = (target, video) => {
        const p = target.play();
        if (p && p.catch) {
          p.catch(() => {
            video.muted = true;
            setNeedsUnmute(true);
            const p2 = target.play();
            if (p2 && p2.catch) p2.catch(() => {});
          });
        }
      };

      useEffect(() => {
        probedItemIdRef.current = null;
        minRequiredModeRef.current = 'DIRECT';
        if (!item?.streamUrl) {
          setAudioTracks([]);
          setSelectedAudioTrack(0);
          setVodMode('DIRECT');
          setLiveModeType('DIRECT_TS');
          setStatus('IDLE');
          return;
        }

        const isDualTitle = /dual/i.test(item.title || '');
        const targetUrlToPlay = (useFhdCompat && item.fhdStreamUrl) ? item.fhdStreamUrl : item.streamUrl;
        const isAvi = item.ext === 'avi' || /\.avi(\?|$)/i.test(targetUrlToPlay);
        const isMkv = item.ext === 'mkv' || /\.mkv(\?|$)/i.test(targetUrlToPlay);
        const is4kTitle = (/4k|2160p/i.test(item.title || '') || /4k/i.test(item.categoryName || '')) && !(useFhdCompat && item.fhdStreamUrl);

        setSelectedAudioTrack(0);
        setLiveModeType('DIRECT_TS');

        // Si la película 4K tiene su versión FHD 1080p vinculada (fhdStreamUrl), entra por REMUX (-c:v copy, 0% CPU y sin pantalla partida)
        const initialVodMode = (isAvi || is4kTitle) ? 'TRANSCODE' : (isMkv ? 'REMUX' : 'DIRECT');
        minRequiredModeRef.current = initialVodMode;
        setVodMode(initialVodMode);

        if (!isLiveMode && item.type !== 'LIVE') {
          if (isDualTitle) {
            setAudioTracks([
              { index: 0, label: 'Español / Latino (Pista 1)' },
              { index: 1, label: 'Inglés / Original (Pista 2)' }
            ]);
          } else {
            setAudioTracks([]);
          }

          // Inspeccionar pistas reales (ej: Los Vengadores 2 trae 2 pistas de audio aunque no dice DUAL en el título)
          let cancelled = false;
          const probeTimer = setTimeout(() => {
            fetch(`/api/media/tracks?url=${encodeURIComponent(targetUrlToPlay)}`)
              .then(r => r.ok ? r.json() : null)
              .then(data => {
                if (cancelled || !data || !data.ok) return;
                if (Array.isArray(data.audioTracks) && data.audioTracks.length > 0) {
                  setAudioTracks(data.audioTracks);
                  // Si la pista 0 viene en inglés y hay otra pista en español (ej. Spider-Man 1948003), preseleccionar español automáticamente
                  const firstLang = (data.audioTracks[0]?.lang || '').toLowerCase();
                  if (firstLang === 'eng' || firstLang === 'en') {
                    const spaTrack = data.audioTracks.find(t => ['spa', 'es', 'lat', 'cast'].includes((t.lang || '').toLowerCase()) || /espa|latino/i.test(t.label || ''));
                    if (spaTrack) {
                      setSelectedAudioTrack(spaTrack.index);
                    }
                  }
                }
                const firstCodec = (data.audioTracks?.[0]?.codec || '').toLowerCase();
                const needsAudioRemux = ['ac3', 'eac3', 'dts', 'truehd', 'flac', 'mp2'].includes(firstCodec);
                if (data.videoWidth > 1920 || data.is10Bit) {
                  minRequiredModeRef.current = 'TRANSCODE';
                  setVodMode('TRANSCODE');
                } else if (data.hasIncompatibleSubs || needsAudioRemux) {
                  if (minRequiredModeRef.current === 'DIRECT') {
                    minRequiredModeRef.current = 'REMUX';
                  }
                  setVodMode((prev) => (prev === 'DIRECT' ? 'REMUX' : prev));
                }
              })
              .catch(() => {});
          }, 800);

          return () => {
            cancelled = true;
            clearTimeout(probeTimer);
          };
        } else {
          setAudioTracks([]);
        }
      }, [item, useFhdCompat]);

      const startPlayback = () => {
        cleanup();
        if (!activeStreamUrl || !videoRef.current) {
          setStatus('IDLE');
          return;
        }
        setStatus('LOADING');
        setNeedsUnmute(false);

        const video = videoRef.current;
        video.muted = false;
        video.volume = 1.0;

        const devParam = `deviceId=${encodeURIComponent(deviceId || '')}`;
        const directProxyUrl = `${window.location.origin}/proxy?${devParam}&url=${encodeURIComponent(activeStreamUrl)}`;

        // 1. MODO TV EN VIVO (LIVE)
        if (isLiveMode || item.type === 'LIVE') {
          const liveStreamUrl = liveModeType === 'FFMPEG_TS'
            ? `${window.location.origin}/api/media/live-ts?${devParam}&url=${encodeURIComponent(activeStreamUrl)}`
            : directProxyUrl;

          if (window.mpegts && window.mpegts.isSupported()) {
            try {
              const player = window.mpegts.createPlayer({
                type: 'm2ts',
                isLive: true,
                url: liveStreamUrl
              }, {
                enableWorker: false,
                lazyLoad: false,
                enableStashBuffer: false,
                fixAudioTimestampGap: true,
                liveBufferLatencyChasing: true,
                liveBufferLatencyMaxLatency: 4.5,
                liveBufferLatencyMinRemain: 0.8,
                autoCleanupSourceBuffer: true,
                autoCleanupMaxBackwardDuration: 25,
                autoCleanupMinBackwardDuration: 12
              });

              playerRef.current = player;
              player.attachMediaElement(video);
              player.load();
              attemptPlay(player, video);

              if (liveModeType === 'DIRECT_TS') {
                // Si el canal viene en MPEG2/MP2/AC3 (como Mega SD) y no decodifica en 8.5s, pasar a transcodificador H264+AAC en vivo
                fallbackTimerRef.current = setTimeout(() => {
                  if (videoRef.current && videoRef.current.readyState < 2) {
                    setLiveModeType('FFMPEG_TS');
                  }
                }, 8500);
              }

              player.on(window.mpegts.Events.ERROR, (errType) => {
                if (video.currentTime > 0 && video.readyState >= 2) return;
                if (liveModeType === 'DIRECT_TS') {
                  setLiveModeType('FFMPEG_TS');
                } else if (errType === window.mpegts.ErrorTypes.NETWORK_ERROR) {
                  setStatus('ERROR');
                }
              });
            } catch (_) {
              if (liveModeType === 'DIRECT_TS') setLiveModeType('FFMPEG_TS');
              else setStatus('ERROR');
            }
          } else {
            video.src = liveStreamUrl;
            video.load();
            attemptPlay(video, video);
          }
          return;
        }

        // 2. MODO CINE Y SERIES (VOD)
        let targetVodUrl = directProxyUrl;
        if (vodMode === 'TRANSCODE') {
          targetVodUrl = `${window.location.origin}/api/media/stream?${devParam}&url=${encodeURIComponent(activeStreamUrl)}&audioTrack=${selectedAudioTrack}&transcodeVideo=1`;
        } else if (vodMode === 'REMUX' || selectedAudioTrack > 0) {
          targetVodUrl = `${window.location.origin}/api/media/stream?${devParam}&url=${encodeURIComponent(activeStreamUrl)}&audioTrack=${selectedAudioTrack}`;
        }

        video.src = targetVodUrl;
        video.load();
        attemptPlay(video, video);

        // Si en modo directo un archivo MKV/AC3 no decodifica en 6.5 segundos en este TV, pasar a REMUX automáticamente
        if (vodMode === 'DIRECT' && selectedAudioTrack === 0) {
          fallbackTimerRef.current = setTimeout(() => {
            if (videoRef.current && videoRef.current.readyState < 2) {
              setVodMode('REMUX');
            }
          }, 6500);
        }
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const syncLiveBufferPosition = () => {
          if (!(isLiveMode || item?.type === 'LIVE')) return;
          try {
            if (video.buffered && video.buffered.length > 0) {
              const start = video.buffered.start(0);
              if (video.currentTime < start - 0.5) {
                video.currentTime = start + 0.1;
                attemptPlay(video, video);
              }
            }
          } catch (_) {}
        };

        const handlePlaying = () => {
          if (fallbackTimerRef.current) {
            clearTimeout(fallbackTimerRef.current);
            fallbackTimerRef.current = null;
          }
          setStatus('PLAYING');
        };
        const handleCanPlay = () => {
          if (fallbackTimerRef.current) {
            clearTimeout(fallbackTimerRef.current);
            fallbackTimerRef.current = null;
          }
          syncLiveBufferPosition();
          setStatus('PLAYING');
        };
        const handleProgress = () => {
          syncLiveBufferPosition();
        };
        const handleTimeUpdate = () => {
          if (video.currentTime > 0) {
            if (fallbackTimerRef.current) {
              clearTimeout(fallbackTimerRef.current);
              fallbackTimerRef.current = null;
            }
            setStatus((prev) => (prev === 'LOADING' ? 'PLAYING' : prev));
          }
        };
        const handleError = () => {
          if (!video.getAttribute('src') && !playerRef.current) return;
          if (isLiveMode || item?.type === 'LIVE') {
            if (liveModeType === 'DIRECT_TS') {
              setLiveModeType('FFMPEG_TS');
            } else {
              setStatus('ERROR');
            }
          } else {
            if (vodMode === 'DIRECT') {
              setVodMode('REMUX');
            } else if (vodMode === 'REMUX') {
              setVodMode('TRANSCODE');
            } else {
              setStatus('ERROR');
            }
          }
        };

        video.addEventListener('playing', handlePlaying);
        video.addEventListener('canplay', handleCanPlay);
        video.addEventListener('progress', handleProgress);
        video.addEventListener('loadedmetadata', handleProgress);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('error', handleError);

        const handleUnload = () => cleanup();
        window.addEventListener('pagehide', handleUnload);
        window.addEventListener('beforeunload', handleUnload);

        return () => {
          video.removeEventListener('playing', handlePlaying);
          video.removeEventListener('canplay', handleCanPlay);
          video.removeEventListener('progress', handleProgress);
          video.removeEventListener('loadedmetadata', handleProgress);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('error', handleError);
          window.removeEventListener('pagehide', handleUnload);
          window.removeEventListener('beforeunload', handleUnload);
        };
      }, [item, vodMode, liveModeType]);

      useEffect(() => {
        startPlayback();
        return () => cleanup();
      }, [activeStreamUrl, vodMode, liveModeType, selectedAudioTrack]);

      const handleSelectAudioTrack = (idx) => {
        setSelectedAudioTrack(idx);
        if (vodMode === 'TRANSCODE' || minRequiredModeRef.current === 'TRANSCODE') {
          setVodMode('TRANSCODE');
        } else if (idx > 0 || minRequiredModeRef.current === 'REMUX') {
          setVodMode('REMUX');
        } else {
          setVodMode('DIRECT');
        }
      };

      const handleUnmute = () => {
        if (videoRef.current) {
          videoRef.current.muted = false;
          videoRef.current.volume = 1.0;
          setNeedsUnmute(false);
          videoRef.current.play().catch(() => {});
        }
      };

      return (
        <div className="space-y-2 w-full">
          <div className="bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-cyan-500/25 w-full flex flex-col justify-center">
            <div className="relative aspect-video bg-black flex items-center justify-center">
              <video
                ref={videoRef}
                poster={BLACK_POSTER}
                controls={!isLiveMode}
                playsInline
                autoPlay
                className="w-full h-full object-contain cursor-pointer bg-black"
                onClick={handleUnmute}
              />

              {!item && (
                <div className="absolute inset-0 bg-[#050C1A] flex flex-col items-center justify-center p-4 text-center pointer-events-none">
                  <div className="w-10 h-10 rounded-2xl bg-cyan-500/15 border border-cyan-400/30 flex items-center justify-center text-cyan-300 font-black text-sm mb-2">
                    TV
                  </div>
                  <span className="text-xs text-slate-300 font-bold">
                    {isLiveMode ? 'Selecciona un canal para ver en la minipantalla' : 'Selecciona un título o capítulo para reproducir aquí'}
                  </span>
                </div>
              )}

              {needsUnmute && (
                <button
                  onClick={handleUnmute}
                  className="absolute top-3 right-3 z-20 px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-2xl flex items-center gap-1.5 animate-bounce"
                >
                  <span>🔊 Activar sonido</span>
                </button>
              )}

              {item && status === 'LOADING' && (
                <div className="absolute inset-0 bg-black/75 flex flex-col items-center justify-center pointer-events-none">
                  <div className="w-9 h-9 border-3 border-cyan-400 border-t-transparent rounded-full animate-spin mb-2"></div>
                  <span className="text-xs text-cyan-300 font-bold">
                    {(liveModeType === 'FFMPEG_TS' || vodMode !== 'DIRECT') ? 'Adaptando señal para tu Smart TV...' : 'Conectando señal...'}
                  </span>
                </div>
              )}

              {item && status === 'ERROR' && (
                <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-4 text-center space-y-2.5 z-10">
                  <p className="text-amber-400 font-bold text-xs">Señal temporalmente no disponible</p>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        if (isLiveMode || item?.type === 'LIVE') setLiveModeType('FFMPEG_TS');
                        else setVodMode('TRANSCODE');
                        startPlayback();
                      }}
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black shadow-xl"
                    >
                      🔄 Reconectar (Modo Compatible)
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* SELECTOR DE PISTA DE AUDIO (DUAL AUDIO / MULTI-IDIOMA) EN CINE Y SERIES */}
          {!isLiveMode && item && (audioTracks.length > 1 || /dual/i.test(item.title || '')) && (
            <div className="px-3 py-2 rounded-xl bg-[#07152B]/90 border border-cyan-500/30 flex flex-wrap items-center justify-between gap-2">
              <span className="text-[11px] font-black text-cyan-300 flex items-center gap-1">
                🔊 Idioma / Audio:
              </span>
              <div className="flex flex-wrap items-center gap-1.5">
                {(audioTracks.length > 1
                  ? audioTracks
                  : [
                      { index: 0, label: 'Español / Latino (Pista 1)' },
                      { index: 1, label: 'Inglés / Original (Pista 2)' }
                    ]
                ).map((tr) => (
                  <button
                    key={tr.index}
                    onClick={() => handleSelectAudioTrack(tr.index)}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                      selectedAudioTrack === tr.index
                        ? 'bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 font-black shadow'
                        : 'bg-slate-900 text-slate-300 hover:bg-cyan-500/20'
                    }`}
                  >
                    {tr.label}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
