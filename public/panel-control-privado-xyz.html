<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Full Premium TvGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#05070D] text-slate-100 min-h-screen font-sans selection:bg-violet-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminApp() {
      const [adminKey, setAdminKey] = useState(() => localStorage.getItem('tvgo_admin_key') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loginError, setLoginError] = useState('');
      
      const [data, setData] = useState({ settings: {}, broadcastMessage: {}, devices: [], licenses: [] });
      const [loading, setLoading] = useState(false);
      const [noteInput, setNoteInput] = useState('');
      const [licenseTier, setLicenseTier] = useState('OFFICIAL');
      const [createdCode, setCreatedCode] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      // ESTADO DE MENSAJERÍA
      const [messageTarget, setMessageTarget] = useState('ALL');
      const [messageText, setMessageText] = useState('');
      const [messageStatus, setMessageStatus] = useState('');

      const fetchOverview = async (keyToUse) => {
        setLoading(true);
        setLoginError('');
        try {
          const res = await fetch('/api/admin/overview', {
            headers: { 'X-Admin-Key': keyToUse }
          });
          if (!res.ok) throw new Error('Clave de administrador no válida');
          const resData = await res.json();
          setData(resData);
          if (resData.broadcastMessage?.text) {
            setMessageText(resData.broadcastMessage.text);
          }
          setIsLoggedIn(true);
          localStorage.setItem('tvgo_admin_key', keyToUse);
        } catch (err) {
          setIsLoggedIn(false);
          setLoginError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (adminKey) fetchOverview(adminKey);
      }, []);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        fetchOverview(adminKey);
      };

      const handleLogout = () => {
        localStorage.removeItem('tvgo_admin_key');
        setAdminKey('');
        setIsLoggedIn(false);
      };

      const handleGenerateLicense = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/admin/generate-license', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ tier: licenseTier, note: noteInput })
          });
          const result = await res.json();
          if (result.ok) {
            setCreatedCode(result.license.code);
            setNoteInput('');
            fetchOverview(adminKey);
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const handleSendMessage = async (active) => {
        setMessageStatus('Enviando...');
        try {
          const res = await fetch('/api/admin/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ target: messageTarget, text: messageText, active })
          });
          const result = await res.json();
          if (result.ok) {
            setMessageStatus(active ? '✔ Mensaje publicado con éxito' : '✔ Mensaje desactivado');
            fetchOverview(adminKey);
            setTimeout(() => setMessageStatus(''), 3000);
          }
        } catch (err) {
          setMessageStatus('Error: ' + err.message);
        }
      };

      const handleDeviceAction = async (deviceId, action) => {
        try {
          const res = await fetch('/api/admin/device-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ deviceId, action })
          });
          const result = await res.json();
          if (result.ok) fetchOverview(adminKey);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const filteredDevices = data.devices.filter(d => 
        d.deviceId.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (d.username && d.username.toLowerCase().includes(searchTerm.toLowerCase()))
      );

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={handleLoginSubmit} className="bg-[#0B0F19] border border-slate-800 p-8 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
              <div className="text-center space-y-1">
                <div className="w-12 h-12 bg-violet-600 rounded-xl flex items-center justify-center font-black text-xl mx-auto shadow-lg shadow-violet-600/30">TV</div>
                <h1 className="text-lg font-bold text-white pt-2">Full Premium TvGo</h1>
                <p className="text-xs text-slate-400">Acceso a Panel Administrativo</p>
              </div>

              <div>
                <input
                  type="password"
                  placeholder="Contraseña Maestra..."
                  value={adminKey}
                  onChange={(e) => setAdminKey(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-violet-500"
                  required
                />
              </div>

              {loginError && <p className="text-xs text-rose-400 text-center">{loginError}</p>}

              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs shadow-lg transition disabled:opacity-50"
              >
                {loading ? 'Validando...' : 'Iniciar Sesión'}
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col p-4 lg:p-8 max-w-7xl mx-auto space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 bg-[#0B0F19] p-4 lg:p-6 rounded-3xl border border-slate-800">
            <div>
              <h1 className="text-xl font-black text-white">Panel de Control & Licencias</h1>
              <p className="text-xs text-slate-400">Gestión de Clientes, Comunicados y Cobros</p>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={() => fetchOverview(adminKey)}
                className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 transition"
              >
                🔄 Actualizar
              </button>
              <button
                onClick={handleLogout}
                className="px-3.5 py-2 rounded-xl bg-rose-600/20 border border-rose-500/30 text-rose-300 hover:bg-rose-600/30 text-xs font-bold transition"
              >
                Cerrar Sesión
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-[#0B0F19] border border-slate-800 p-5 rounded-2xl">
              <div className="text-xs font-bold text-slate-400">Dispositivos Totales</div>
              <div className="text-3xl font-extrabold text-white mt-1">{data.devices.length}</div>
            </div>
            <div className="bg-[#0B0F19] border border-emerald-500/30 p-5 rounded-2xl bg-emerald-950/10">
              <div className="text-xs font-bold text-emerald-400">Licencias Pagadas (1 Año)</div>
              <div className="text-3xl font-extrabold text-white mt-1">
                {data.devices.filter(d => d.computed?.status === 'LICENSED').length}
              </div>
            </div>
            <div className="bg-[#0B0F19] border border-amber-500/30 p-5 rounded-2xl bg-amber-950/10">
              <div className="text-xs font-bold text-amber-400">En Periodo de Prueba (12 Días)</div>
              <div className="text-3xl font-extrabold text-white mt-1">
                {data.devices.filter(d => d.computed?.status === 'TRIAL').length}
              </div>
            </div>
          </div>

          {/* MÓDULO DE COMUNICADOS Y MENSAJERÍA */}
          <div className="bg-[#0B0F19] border border-violet-500/30 p-5 rounded-3xl space-y-4 shadow-xl">
            <div className="flex items-center justify-between">
              <h2 className="text-sm font-black text-white flex items-center gap-2">
                <span>📢 Enviar Mensaje / Comunicado en Vivo a Usuarios</span>
              </h2>
              {data.broadcastMessage?.active && (
                <span className="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-black uppercase">
                  Comunicado Global Activo
                </span>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label className="block text-[11px] text-slate-400 mb-1 font-semibold">Destinatario</label>
                <select
                  value={messageTarget}
                  onChange={e => setMessageTarget(e.target.value)}
                  className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                >
                  <option value="ALL">🌐 Todos los Usuarios (Global)</option>
                  {data.devices.map(d => (
                    <option key={d.deviceId} value={d.deviceId}>📱 {d.deviceId} {d.username ? `(${d.username})` : ''}</option>
                  ))}
                </select>
              </div>

              <div className="md:col-span-2">
                <label className="block text-[11px] text-slate-400 mb-1 font-semibold">Mensaje para mostrar en pantalla</label>
                <input
                  type="text"
                  placeholder="Ej: Mantenimiento programado hoy a las 23:30 hrs. ¡Disfruta el nuevo servidor!"
                  value={messageText}
                  onChange={e => setMessageText(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-violet-500"
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div className="text-xs font-semibold text-emerald-400">{messageStatus}</div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => handleSendMessage(false)}
                  className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition"
                >
                  Ocultar / Borrar Mensaje
                </button>
                <button
                  type="button"
                  onClick={() => handleSendMessage(true)}
                  className="px-5 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-black shadow-lg transition"
                >
                  🚀 Publicar Mensaje en la App
                </button>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Generador de Licencias */}
            <div className="bg-[#0B0F19] border border-slate-800 p-5 rounded-3xl space-y-4">
              <h2 className="text-sm font-bold text-white flex items-center gap-2">
                <span>🔑 Generar Licencia Manual (1 Año)</span>
              </h2>
              <form onSubmit={handleGenerateLicense} className="space-y-3">
                <div>
                  <label className="block text-[11px] text-slate-400 mb-1">Tipo de Tarifa</label>
                  <select
                    value={licenseTier}
                    onChange={(e) => setLicenseTier(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                  >
                    <option value="OFFICIAL">⭐ Oficial ($4.000 CLP)</option>
                    <option value="EXTERNAL">🌐 Lista Propia ($6.000 CLP)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-[11px] text-slate-400 mb-1">Nota / Cliente (Opcional)</label>
                  <input
                    type="text"
                    placeholder="Ej: Pago Juan Pérez CuentaRUT"
                    value={noteInput}
                    onChange={(e) => setNoteInput(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs shadow-lg transition"
                >
                  + Generar Código
                </button>
              </form>

              {createdCode && (
                <div className="p-3 bg-violet-950/40 border border-violet-500/40 rounded-xl text-center space-y-1">
                  <div className="text-[10px] text-violet-300 font-bold uppercase">Código Creado:</div>
                  <div className="text-sm font-mono font-black text-white select-all">{createdCode}</div>
                </div>
              )}

              <div className="pt-2 border-t border-slate-800/80">
                <div className="text-xs font-bold text-slate-300 mb-2">Últimas Licencias Creadas</div>
                <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                  {data.licenses.map(lic => (
                    <div key={lic.code} className="p-2 bg-slate-900/60 rounded-xl border border-slate-800 text-[11px] flex justify-between items-center">
                      <div>
                        <div className="font-mono font-bold text-violet-300">{lic.code}</div>
                        <div className="text-[10px] text-slate-500">{lic.note || 'Sin nota'}</div>
                      </div>
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${lic.usedBy ? 'bg-slate-800 text-slate-400' : 'bg-emerald-500/20 text-emerald-300'}`}>
                        {lic.usedBy ? 'Canjeada' : 'Disponible'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Tabla de Dispositivos */}
            <div className="lg:col-span-2 bg-[#0B0F19] border border-slate-800 p-5 rounded-3xl space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <h2 className="text-sm font-bold text-white">Dispositivos Registrados ({filteredDevices.length})</h2>
                <input
                  type="text"
                  placeholder="Buscar ID o usuario..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                />
              </div>

              <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-900/90 text-slate-400 text-[11px] sticky top-0">
                    <tr>
                      <th className="p-2.5 rounded-l-xl">Dispositivo ID</th>
                      <th className="p-2.5">Estado</th>
                      <th className="p-2.5">Días</th>
                      <th className="p-2.5">Modalidad</th>
                      <th className="p-2.5 rounded-r-xl text-right">Acciones Directas</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {filteredDevices.map(dev => (
                      <tr key={dev.deviceId} className="hover:bg-slate-900/40">
                        <td className="p-2.5 font-mono font-bold text-white">
                          {dev.deviceId}
                          {dev.username && <div className="text-[10px] text-slate-500 font-sans">{dev.username}</div>}
                          {dev.customMessage && (
                            <div className="text-[10px] text-amber-400 truncate max-w-xs">💬 {dev.customMessage}</div>
                          )}
                        </td>
                        <td className="p-2.5">
                          {dev.computed?.status === 'LICENSED' && (
                            <span className="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 font-bold text-[10px]">1 Año Activo</span>
                          )}
                          {dev.computed?.status === 'TRIAL' && (
                            <span className="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-bold text-[10px]">Prueba</span>
                          )}
                          {dev.computed?.status === 'EXPIRED_TRIAL' && (
                            <span className="px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-300 font-bold text-[10px]">Vencido</span>
                          )}
                          {dev.computed?.status === 'BLOCKED_ADMIN' && (
                            <span className="px-2 py-0.5 rounded-md bg-red-600/30 text-red-200 font-bold text-[10px]">Bloqueado</span>
                          )}
                        </td>
                        <td className="p-2.5 text-slate-300">{dev.computed?.daysLeft} días</td>
                        <td className="p-2.5 text-slate-400 text-[11px]">{dev.clientType === 'OFFICIAL' ? 'Oficial ($4k)' : 'Lista ($6k)'}</td>
                        <td className="p-2.5 text-right space-x-1 whitespace-nowrap">
                          <button
                            onClick={() => { setMessageTarget(dev.deviceId); window.scrollTo({ top: 300, behavior: 'smooth' }); }}
                            className="px-2 py-1 rounded-lg bg-violet-900/50 hover:bg-violet-800 text-violet-300 text-[10px] font-bold"
                            title="Escribir mensaje directo a este equipo"
                          >
                            💬 Mensaje
                          </button>
                          <button
                            onClick={() => handleDeviceAction(dev.deviceId, 'ACTIVATE_1Y')}
                            className="px-2 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px]"
                          >
                            +1 Año
                          </button>
                          <button
                            onClick={() => handleDeviceAction(dev.deviceId, 'RESET_TRIAL')}
                            className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-[10px]"
                          >
                            Reiniciar
                          </button>
                          {dev.blockedManually ? (
                            <button
                              onClick={() => handleDeviceAction(dev.deviceId, 'UNBLOCK')}
                              className="px-2 py-1 rounded-lg bg-emerald-800 text-white text-[10px]"
                            >
                              Desbloquear
                            </button>
                          ) : (
                            <button
                              onClick={() => handleDeviceAction(dev.deviceId, 'BLOCK')}
                              className="px-2 py-1 rounded-lg bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-[10px]"
                            >
                              Bloquear
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
